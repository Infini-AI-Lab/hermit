# Framework-owned policy. The Evolver cannot expand its write scope.
backend = "codex"
network = true

# Adapter, evidence, method, and history access are intrinsic.
# These are ADDITIONAL environment directories, always read-only.
[read_access]
paths = []

# To allow all reads, replace the entire [read_access] section with
# a top-level entry: read_access = "all"
# This never grants writes outside the candidate and isolated scratch.
