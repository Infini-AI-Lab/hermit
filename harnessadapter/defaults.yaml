# Framework defaults. A run.yaml and command-line overrides (key.sub=value) change only what they name.
data:
  tasks: null
  train: null
  val: null
  test: null
  step_size: 8
  shuffle: true               # false: every epoch takes the train split in file order (an ordered stream)
  shuffle_seed: 0
task_info: null
agent:
  name: null                  # react | codex | claude-code, or file.py:Class / file.py:function of the task's own
  concurrency: 4
  params: {}
pipeline:                     # the older spelling of `agent`: run -> name
  run: null
  concurrency: null
  params: {}
judge:
  path: null
  name: score
template: null
start_from: null
evolver:
  name: null
  resume: false
  params: {}
evolver_access:
  environment: []
  tools: []
  send_material_out: false
sandbox:
  enabled: true
  enforce: required            # required: refuse to run without bubblewrap | best_effort: run unconfined, recorded
  network: isolated            # isolated: own network namespace, only the forwarded ports | open: the host network
  allow: []                    # hosts reachable through the allowlist proxy when the network is isolated
  read: []                     # more paths the Evolver may read (an allowlist; nothing else is visible)
  packages: []                 # more Python distributions to show, beside the framework's own dependencies
  env: null                    # environment variables passed to what the Evolver starts; null = all of them
  audit: null                  # files: strace each sandboxed process's file accesses (from outside) beside its record
  profiles: {}                 # per role (learner, rollout, eval, check, tool): {enabled, inherit, read, write, allow,
                               # packages}; e.g. profiles: {rollout: {read: [../env]}}, {eval: {enabled: false}}
model: null                    # the run's default model, a `<backend>/<model id>` reference (see backends): what `llm`,
                               # agent.params.model and evolver.params.model use when they name none
backends: {}                   # this run's model backends by name: {base_url, api_key_env, apis, prices, ...} or
                               # {from: <other>, base_url: ...}; over ~/.config/harnessadapter/backends.yaml and the built-ins
llm: null                      # the run's `llm` tool: `<backend>/<model>`, {model: <ref>, extra_body}, or
                               # {base_url, model, api_key_env, price: {input, cached_input, output}, extra_body}
trainer:
  run_name: null
  output_dir: runs
  tree_dir: null               # default: <output_dir>/trees/<template id>
  epochs: 1
  allow_early_stop: false
  resume_mode: auto
  save_freq: {steps: null, epochs: 1}
  budget: {usd: null, tokens: null, hours: null}
  call_timeout_min: 60
eval:
  repeats: 1
