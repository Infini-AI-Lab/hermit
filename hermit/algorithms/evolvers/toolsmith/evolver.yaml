description: A scripted toolsmith. One model call per step rewrites the adapter's instructions (ADAPTER.md) and its
  tool bundles (tools/<name>/) from the step's trajectories, the judge's feedback and the previous self-tests; the
  new tools are then run through the task's confined runner (their own test, then one call with example_args) and
  the model gets one repair turn with the exact failures. Uses the run's `llm` tool (configure `llm` in run.yaml).
class: evolver.py:ToolsmithEvolver
needs: []
params:
  max_examples: 8            # tasks shown to the model per step (lowest scores first)
  max_chars: 6000            # per field of a task record (input, output, judge feedback)
  trajectory_chars: 20000    # per trajectory digest (tool calls, errors, the agent's final message)
  max_tokens: 32000          # reasoning models spend much of it thinking
  temperature: 0.3
  runner_tool: null          # a task tool (evolver_access.tools) with confine.run's signature; null = no self-tests
  test_timeout_s: 300        # per self-test program and per contract call (the template's tool maximum)
  max_tests_per_round: 4     # bundles tested per round (changed first, then never tested)
  test_total_s: 1200         # wall-clock cap of one self-test round (four tools at the maximum)
  repair_rounds: 1           # extra model turns with the failures of the self-tests
  images: 0                  # self-test images attached to the model's prompt (0 = text only; the learner stays blind)
  exposed_tools_max: 8       # tools the agent's harness exposes (the template admits at most 8, alphabetically)
  require_image: true        # a tool counts as working only when it returns a non-blank PNG (false: text tools too)
