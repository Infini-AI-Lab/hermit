# The ReHarness adapter (Xiao et al., arXiv:2610.12668): the textual harness state h_t, a bank of reflections, one
# per past instance of the stream, each with the embedding of the instance's input. Before every instance the
# harness retrieves the top-k reflections for the instance's input and gives them to the decision agent below
# ADAPTER.md (Eq. 1); after it, the Evolver revises the retrieved reflections and writes a new one (Eqs. 2-3).
template:
  id: reharness
  version: "1.0"
  contract: "1"
  name: ReHarness
exports:
  context: ADAPTER.md
  tools:
    - name: reflections
      description: 'The harness''s retrieval: the top-k reflections of the bank for an instance''s input, rendered
        as [RANKED REFLECTIONS]. Called by the harness once per instance (exports.context_tool), never by the
        agent; an empty query retrieves nothing.'
      entrypoint: interface.py:reflections
      input_schema:
        type: object
        properties:
          query: {type: string}
          task: {type: object}
        additionalProperties: false
      output_schema:
        type: object
        properties:
          text: {type: string}
          retrieved: {type: array}
          query: {type: string}
          k: {type: integer}
          bank_size: {type: integer}
          retrieval: {type: string}
        required: [text, retrieved, k, bank_size, retrieval]
      annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
  context_tool: reflections
structure:
  learnable:
    - path: ADAPTER.md                 # the decision agent's instructions above the retrieved reflections
      format: {text: true, max_bytes: 40000}
    - path: index.json                 # k, the retrieval (embedding model or bm25); written by the Evolver's bootstrap
      format: {text: true, max_bytes: 4000}
    - path: reflections/*.json         # the bank: one reflection per past instance, with its input's embedding
      format: {text: true, max_bytes: 400000}
  fixed:
    - interface.py
    - reharness_core
    - check.py
    - EVOLVER.md
    - README.md
check: check.py:check
