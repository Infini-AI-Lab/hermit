# The Continual Harness adapter: the harness state a Refiner maintains — base policy p, sub-agents G, skills K,
# memory M, as separate learnable files — rendered into ADAPTER.md, which is what the agent reads as its context.
template:
  id: continual-harness
  version: "1.0"
  contract: "1"
  name: Continual Harness
exports:
  context: ADAPTER.md          # the push channel: policy + sub-agents + skills + memory, rendered into the context
  tools:                       # the pull channel: the agent fetches one part of the harness on demand
    - name: harness
      description: >-
        Reach the evolved harness. name: "skills" (reusable procedures K), "memory" (facts/notes M), "subagents"
        (named playbooks G), or "list" (which parts are populated and their headings). args: optionally
        {"query": "..."} to filter skills/memory/subagents to matching sections. The context already carries the
        whole harness; use this to pull one part on demand.
      entrypoint: interface.py:harness
      input_schema:
        type: object
        properties:
          name: {type: string, enum: [skills, memory, subagents, list]}
          args: {type: object}
        required: [name]
        additionalProperties: false
      output_schema:
        type: object
      annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
        openWorldHint: false
  agents:                      # sub-agents G: each `## name` section of subagents.md becomes a delegable sub-agent
    entrypoint: interface.py:agent_definitions
structure:
  learnable:
    - path: ADAPTER.md          # the rendered context (policy + sub-agents + skills + memory); the agent reads this.
      format: {text: true, max_bytes: 200000}   # derived artifact: must be >= the sum of the four part caps below
                                                 # (4 x 40000) + headings, else a grown harness fails check_spec and
                                                 # every step reverts (freezes the Refiner)
    - path: policy.md           # p — the base policy / instructions
      format: {text: true, max_bytes: 40000}
    - path: subagents.md        # G — named playbooks for repeated multi-step patterns
      format: {text: true, max_bytes: 40000}
    - path: skills.md           # K — reusable procedures / step sequences that worked
      format: {text: true, max_bytes: 40000}
    - path: memory.md           # M — facts and notes discovered while acting
      format: {text: true, max_bytes: 40000}
  fixed:
    - interface.py              # the tool/agent exporter — code, never evolved; the Refiner edits only the parts
    - EVOLVER.md
    - README.md
