# Framework defaults. A run.yaml and command-line overrides (key.sub=value) change only what they name.
data:
  tasks: null
  train: null
  val: null
  test: null
  step_size: 8
  shuffle: true               # false: every epoch takes the train split in file order (an ordered stream)
  shuffle_seed: 0
task_info: null
agent:
  name: null                  # react | codex | claude-code | pi | mini-swe-agent | opencode | dsh, or file.py:Class /
                              # file.py:function of the task's own
  concurrency: 4
  timeout_min: null           # a sandboxed task call that runs longer is stopped and recorded as an error; null: none
  params: {}                  # Layer 3: the Acting Agent's own settings (docs/framework/agent-layers.md)
  base: null                  # Layer 2: codex | claude | pi | mini-swe-agent | opencode | dsh | react | direct; its
                              # settings go in a section of its name
  model: null                 # Layer 1: a <backend>/<model> reference, or {ref | name, login, effort, price, ...}
  codex: null
  claude: null
  pi: null
  mini-swe-agent: null
  opencode: null
  dsh: null
  react: null
  direct: null
pipeline:                     # the older spelling of `agent`: run -> name
  run: null
  concurrency: null
  params: {}
environment:                   # the task sandbox, where the acting agent runs (rollouts, eval, check)
  runner: sandbox              # sandbox: in the task sandbox | host: in the Trainer's process, for a task whose own
                               # code isolates what it runs (AgentDyn's hooks in containers); warned
  image: null                  # a Docker image: a CLI acting agent runs in a container of its own (Codex or
                               # Claude Code)
  container: {}                # with image: the container's network and egress proxy (hermit/agent/base/container.py)
  packages: []                 # no image: Python distributions shown besides the framework's environment (an editable
                               # install's package, one on PYTHONPATH), with their dependencies
  read: []                     # no image: task paths shown read-only (relative to this file); never the data, the
                               # judge or the runs
  write: []                    # paths the acting agent may write besides its own work directory
  env: []                      # environment variables passed in, names or patterns (MWM_*); the agent's model key
                               # passes anyway; a Claude login's token passes by name to each call
  network: no-network          # no-network | allowlist | public; the agent's model and the tool endpoint stay reachable
  allowed_hosts: []            # allowlist: hosts reachable through the allowlist proxy
  resources: {}                # memory_mb, file_mb, cpu_s: per process
  gpu: []                      # NVIDIA GPUs shown, by the N of /dev/nvidia<N> (CUDA and EGL; inside they count from 0);
                               # none: no GPU (EGL renders in software where Mesa is installed)
judge:
  path: null
  name: score
  mode: host                   # host: on the host, from the answer | shared: in the task sandbox after the agent |
                               # separate: in a fresh judge sandbox holding the collected paths
  tests: []                    # shared, separate: paths only the judge sees, read-only (its answers, test files)
  collect: []                  # separate: paths of the agent's work directory carried to the judge sandbox
template: null
start_from: null
evolver:
  name: null
  resume: false
  params: {}                  # Layer 3: the method's settings
  base: null                  # Layer 2: codex | claude | pi | opencode | dsh | direct
                              # (the Base Agent the method runs on)
  model: null                 # Layer 1: as agent.model; with direct it is the run's `llm`
  codex: null
  claude: null
  pi: null
  opencode: null
  dsh: null
  direct: null
evolver_access:
  environment: []
  tools: []
  send_material_out: false
sandbox:                       # docs/developer/sandbox-design.md
  enabled: true                # false: everything the run starts runs unconfined (a warning; not for reported results)
  enforce: required            # required: refuse to run without bubblewrap | best_effort: run unconfined, recorded
  hide: []                     # modules or packages of the framework's environment covered in every sandbox but the
                               # judge's (a benchmark's scoring the agent does not import): `pkg.scoring`
  evolver:                     # the learner's sandbox: a fixed layout under /w, its models, the tool endpoint
    allowed_hosts: []          # more hosts the learner may reach, through the allowlist proxy
    env: []                    # environment variables passed to the learner's sessions (its models' keys pass anyway;
                               # a Claude login's token goes by name with each session on it)
    resources: {}              # memory_mb, file_mb, cpu_s: per process
model: null                    # the run's default model, a `<backend>/<model id>` reference (see backends): what `llm`,
                               # agent.params.model and evolver.params.model use when they name none
backends: {}                   # this run's model backends by name: {base_url, api_key_env, apis, prices, ...} or
                               # {from: <other>, base_url: ...}; over ~/.config/hermit/backends.yaml and the built-ins
llm: null                      # the run's `llm` tool: `<backend>/<model>`, {model: <ref>, extra_body}, or
                               # {base_url, model, api_key_env, price: {input, cached_input, output}, extra_body}
trainer:
  run_name: null
  output_dir: runs
  tree_dir: null               # default: <output_dir>/trees/<template id>
  epochs: 1
  allow_early_stop: false
  resume_mode: auto
  save_freq: {steps: null, epochs: 1}
  budget: {usd: null, tokens: null, hours: null}
  call_timeout_min: 60
run:                           # how the run is done (hermit/config.py RUN_MODES)
  mode: null                   # null: as before | eval: hermit eval only | split: train, then the test split on the
                               # final adapter | stream: each row scored once, before it is learned from
  feedback: null               # what the learner is shown of each verdict: full | score | none; null is full, and a
                               # stream must name it
  orders: null                 # stream: [seeds] (Hermit orders the train split, a task's #k rows kept together) or
                               # [files] (each an order of its own); each order is a run of its own, <run_name>-o<i>
  checkpoints: null            # stream: [{name, after: <task id> | end, split: <file>, adapters: [checkpoint | final |
                               # root]}]: the commit after the step that ends with `after`, tested on `split`
  checkpoints_during: false    # true: a checkpoint's test runs right after the step that reaches it (else after
                               # training)
  state: null                  # 'file.py:fn' (run_dir, step record, commit) -> environment overrides for a
                               # checkpoint's test
  score: null                  # 'file.py:fn' (records, name) -> the benchmark's own scores of a checkpoint's test
eval:
  repeats: 1
  infra_retries: 0             # rows that ended infra (not the agent's result) are run again up to this many times
  infra_wait_s: 600            # ... this long after each pass
