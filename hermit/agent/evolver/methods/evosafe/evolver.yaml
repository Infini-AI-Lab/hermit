description: Propose a defense bundle, evaluate parent and candidate on fixed cases, and accept only an improvement.
class: evolver.py:EvoSafeEvolver
needs: []
params:
  search_mode: single
  max_proposals: 2
  mechanism_schedule: []
  cascade_sizes: [6, 12]
  evaluation_repeats: 1
  reuse_rollout_parent: true
  parent_error_policy: reject   # reject | conservative_bounds (failed parent runs get their best possible verdict)
  candidate_error_policy: reject   # reject | worst_case_bounds (failed candidate runs get their worst possible verdict)
  role_retries: 0             # extra attempts for a failed codex/claude role call (never for refusals)
  review_revisions: 2         # extra Criticizer rounds (total capped at 3), then a final Designer repair
  spec_repair_attempts: 2     # extra repairs for size/spec failures; no Criticizer call is spent
  max_defense_bytes: 32000    # role search budget in UTF-8 bytes; never exceeds the template limit
  evidence_chars_per_case: 2000   # initial summaries; complete TRAIN observations available through role tools
  robustness_task_ids: []
  # Prefer evolver.base/model/<base>; these fields keep old configurations readable.
  proposer: llm               # llm | codex | claude (Claude Code CLI; read-only TRAIN experience tools)
  codex_bin: codex
  codex_model: gpt-6-sol
  codex_timeout_s: 600
  claude_bin: claude
  claude_model: null
  claude_timeout_s: 1200
  eval_task_ids: []
  min_clean_utility: 0.0
  max_clean_drop: 0.0
  min_improvement: 0.0
  gate_mode: strict           # strict | source (the source method's cascade; see docs/methods/evosafe.md)
  stage_utility_ratio: 0.7    # source: an intermediate stage keeps utility >= ratio x parent
  stage_asr_ratio: 1.3        # source: and ASR <= ratio x parent
  validation_tolerance: 0.07  # source: validation objective may trail the parent by at most this
  max_tokens: 6000
