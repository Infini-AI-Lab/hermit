description: A Hermes Agent improves the adapter from the step's learning material.
class: hermit.agent.evolver.agent:AgentEvolver
needs: []
params:
  backend: hermes
  prompt: START.md
  resume_prompt: RESUME.md
  args: []
  model: null                # a <backend>/<model> reference (Hermes's config.yaml provider, the key from its variable)
  price: null                # USD per million tokens {input, cached_input, output}; null: the backend's
  home: []                   # no file of ~/.hermes is copied: Hermes signs in through the model reference
  tools: null                # the only Trainer tools the agent may use, e.g. [check_spec]; null: all
  web_search: false          # Hermes's web search and extraction are off: false is its only setting
  max_turns: null            # model requests in one step's session; null: Hermes's own 90
