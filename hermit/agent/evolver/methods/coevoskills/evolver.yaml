description: CoEvoSkills adapter integration for the unchanged common OfficeQA actor. Calls the original upstream loop on training questions; only executable adapter Skills are updated. Final evaluation freezes the adapter on the common test split.
class: evolver.py:CoEvoSkillsEvolver
needs: []
params:
  cli_backend: codex
  model_name: gpt-5.6-luna
  upstream_root: $COEVOSKILLS_ROOT
  task_packages: data/packages
  seed: common_seed
  max_iterations: 5
  max_episodes: 120
  task_timeout_s: 7200
  completion_timeout_s: 600
  effort: medium
