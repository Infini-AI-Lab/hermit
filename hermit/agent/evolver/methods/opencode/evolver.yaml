description: An OpenCode agent improves the adapter from the step's learning material.
class: hermit.agent.evolver.agent:AgentEvolver
needs: []
params:
  backend: opencode
  prompt: START.md
  resume_prompt: RESUME.md
  args: []
  model: null                # a <backend>/<model> reference (OpenCode's config provider, the key from its variable)
  price: null                # USD per million tokens {input, cached_input, output}; null: the backend's
  home: []                   # no file of OpenCode's data folder is copied: it signs in through the model reference
  tools: null                # the only Trainer tools the agent may use, e.g. [check_spec]; null: all
  web_search: false          # OpenCode's web search and fetch are off: false is its only setting
