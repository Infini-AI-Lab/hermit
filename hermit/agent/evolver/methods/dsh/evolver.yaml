description: A DeepSeek Harness (dsh) agent improves the adapter from the step's learning material.
class: hermit.agent.evolver.agent:AgentEvolver
needs: []
params:
  backend: dsh
  prompt: START.md
  resume_prompt: RESUME.md
  args: []
  model: null                # a <backend>/<model> reference (dsh's pi-ai route, the key read from its variable)
  price: null                # USD per million tokens {input, cached_input, output}; null: the backend's
  home: []                   # no file of ~/.dsh is copied: dsh signs in through the model reference
  tools: null                # the only Trainer tools the agent may use, e.g. [check_spec]; null: all
  web_search: false          # dsh's web search and fetch tools; the evolver sandbox reaches only the model
