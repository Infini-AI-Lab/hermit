name: hermit_stream
version: "1.0.0"
description: "hermit's event stream: each hook's payload as one JSON line on the session's stdout (hermit.agent.base.cli.Hermes)."
author: hermit
hooks:
  - on_session_start
  - pre_api_request
  - post_api_request
  - api_request_error
  - post_tool_call
  - post_llm_call
  - on_session_end
