name: Tests

# What every change must pass before it merges: the package installs in a clean environment, the test suite
# passes on the supported Python versions, and the documentation builds without warnings. Nothing here calls a
# model, needs a key, a GPU or a CLI agent; those paths have manual entry points (the examples' launchers).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install bubblewrap (the learner sandbox; its tests skip without it)
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
      - name: Install the package
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[test]'
      - name: The package imports and the console script runs
        run: |
          python -c "import harnessadapter, harnessadapter.backends; print(harnessadapter.__file__)"
          harnessadapter --help
          harnessadapter backends list
      - name: Can bubblewrap make namespaces here?
        run: bwrap --unshare-user --unshare-net --ro-bind / / true && echo "bwrap works" || echo "bwrap cannot unshare on this runner: its tests will be skipped"
      - name: Test suite
        run: python -m pytest tests -q -rs --durations=10

  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package and the docs tools
        run: |
          python -m pip install -U pip
          python -m pip install -e . -r docs/requirements.txt
      - name: Build with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html

  extras:
    # The gepa and skillopt Evolvers install from git and take minutes: not on every PR, only once a change is
    # on main or when asked for.
    name: tests with the gepa and skillopt extras
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with the extras
        run: |
          python -m pip install -U pip
          python -m pip install -e '.[test,gepa,skillopt]'
      - name: The optimizer Evolvers' tests
        run: python -m pytest tests/test_optimizer_evolvers.py -q -rs
