[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermit-harness"
version = "0.2.0"
description = "Train harness adapters: templates, Evolvers, a Trainer and evolving tasks; deploy adapters into Codex and Claude Code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]
# The gepa and skillopt Evolvers, pinned to the tested commits.
gepa = ["gepa @ git+https://github.com/gepa-ai/gepa@d771eb21b5dd3228bc3f567293d2ccfc423fc900"]
# json_repair: SkillOpt recovers malformed JSON from non-OpenAI optimizer models with it (its own qwen/claude extras).
skillopt = ["skillopt @ git+https://github.com/microsoft/SkillOpt@79124b37e9a6371e13b753f8bcd7adb1e493ade1",
            "json_repair>=0.61.0"]
# The harness2_upstream Evolver runs upstream Harness² (no dependencies of its own), pinned to the tested commit.
harness2 = ["harness2 @ git+https://github.com/google-research/harness2@1cfe254e8d25b15f37048c3730134686abe60335"]

[project.scripts]
hermit = "hermit.cli:main"

[project.urls]
Homepage = "https://github.com/haizhongzheng/hermit"
Documentation = "https://github.com/haizhongzheng/hermit/tree/main/docs"
Issues = "https://github.com/haizhongzheng/hermit/issues"
Changelog = "https://github.com/haizhongzheng/hermit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hermit*"]

[tool.setuptools.package-data]
hermit = ["defaults.yaml", "backends.yaml", "algorithms/evolvers/**/*", "algorithms/templates/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools]
include-package-data = true
