[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessadapter"
version = "0.2.0"
description = "Train harness adapters: templates, Evolvers, a Trainer and evolving tasks; deploy adapters into Codex and Claude Code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]
# The gepa and skillopt Evolvers, pinned to the tested commits.
gepa = ["gepa @ git+https://github.com/gepa-ai/gepa@d771eb21b5dd3228bc3f567293d2ccfc423fc900"]
# json_repair: SkillOpt recovers malformed JSON from non-OpenAI optimizer models with it (its own qwen/claude extras).
skillopt = ["skillopt @ git+https://github.com/microsoft/SkillOpt@79124b37e9a6371e13b753f8bcd7adb1e493ade1",
            "json_repair>=0.61.0"]

[project.scripts]
harnessadapter = "harnessadapter.cli:main"

[tool.setuptools.packages.find]
include = ["harnessadapter*"]

[tool.setuptools.package-data]
harnessadapter = ["defaults.yaml", "backends.yaml", "algorithms/evolvers/**/*", "algorithms/templates/**/*"]

[tool.setuptools]
include-package-data = true
