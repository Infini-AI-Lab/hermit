[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessadapter"
version = "0.2.0"
description = "Train harness adapters: templates, Evolvers, a Trainer and evolving tasks; deploy adapters into Codex and Claude Code"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harnessadapter = "harnessadapter.cli:main"

[tool.setuptools.packages.find]
include = ["harnessadapter*"]

[tool.setuptools.package-data]
harnessadapter = ["defaults.yaml", "evolvers/**/*", "templates/**/*"]

[tool.setuptools]
include-package-data = true
