[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermit-harness"
version = "0.2.0"
description = "Train harness adapters: templates, Evolvers, a Trainer and evolving tasks; deploy adapters into Codex and Claude Code"
readme = "README-pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
    "packaging>=24",
]

[project.optional-dependencies]
test = ["pytest"]
# The bubblewrap sandboxes show the framework's environment: what is installed here is what agents and learners can
# import (python -m pip install "hermit-harness[sandbox]").
sandbox = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "torch>=2.8"]
# The mini-swe-agent Base Agent and deploy host (hermit.agent.base.mini_swe_agent); it brings litellm.
mini-swe-agent = ["mini-swe-agent==2.4.6"]

# Source-only method dependencies: groups are not included in PyPI package metadata.
# From the checkout root, use pip >=25.1: python -m pip install -e . --group <method>.
[dependency-groups]
she = [
    "she-safety-harness-evolution @ git+https://github.com/RainbowQTT/SHE@0c656460d9d8acdf406a2271d657f7a7b60bb255",
]
gepa = [
    "gepa @ git+https://github.com/gepa-ai/gepa@d771eb21b5dd3228bc3f567293d2ccfc423fc900",
]
skillopt = [
    "skillopt @ git+https://github.com/microsoft/SkillOpt@79124b37e9a6371e13b753f8bcd7adb1e493ade1",
    "json_repair>=0.61.0",
]
harness2 = [
    "harness2 @ git+https://github.com/google-research/harness2@1cfe254e8d25b15f37048c3730134686abe60335",
]
ace = [
    "sentence-transformers>=2.2.0",
]
rrsi = [
    "rrsi @ git+https://github.com/google-research/rrsi@be50316e1db05914068a973f322770ef08ed7ba1",
]
all = [
    { include-group = "she" },
    { include-group = "gepa" },
    { include-group = "skillopt" },
    { include-group = "harness2" },
    { include-group = "ace" },
    { include-group = "rrsi" },
]

[project.scripts]
hermit = "hermit.cli:main"

[project.urls]
Homepage = "https://infini-ai-lab.github.io/hermit/"
Repository = "https://github.com/Infini-AI-Lab/hermit"
Documentation = "https://infini-ai-lab.github.io/hermit/docs/"
Issues = "https://github.com/Infini-AI-Lab/hermit/issues"
Changelog = "https://github.com/Infini-AI-Lab/hermit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hermit*"]

[tool.setuptools.package-data]
hermit = ["defaults.yaml", "agent/model/backends.yaml", "agent/base/mini_swe_agent.yaml",
          "agent/evolver/methods/**/*", "adapter/templates/**/*",
          "agent/evolver/methods/**/.lint_blacklist",
          "adapter/templates/**/.agents/**/*", "adapter/templates/**/.codex/**/*",
          "adapter/templates/**/.hermit/**/*"]   # globs skip dot-directories

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]   # the framework's tests and an example's own (examples/*/utils/tests/)
python_files = ["test_*.py"]        # the one name tests/core/test_selection.py's guards look for
