[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessadapter"
version = "0.1.0"
description = "Evolvable Harness Adapters: cores an acting agent consumes as context, MCP tools and native roles, evolved by sandboxed learner sessions"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]
# Optimizer Evolvers (harnessadapter evolve --evolver gepa|skillopt). Pinned to the upstream commits
# they were integrated and tested against. SkillOpt's default recipe lives in
# its source tree (configs/), so prefer an editable checkout of it:
#   pip install -e /path/to/SkillOpt   (or set SKILLOPT_HOME)
gepa = ["gepa @ git+https://github.com/gepa-ai/gepa@d771eb21b5dd3228bc3f567293d2ccfc423fc900"]
skillopt = ["skillopt @ git+https://github.com/microsoft/SkillOpt@79124b37e9a6371e13b753f8bcd7adb1e493ade1"]

[project.scripts]
harnessadapter = "harnessadapter.cli:main"

[tool.setuptools.packages.find]
include = ["harnessadapter*"]

[tool.setuptools.package-data]
harnessadapter = ["evolvers/**/*", "architectures/**/*"]

[tool.setuptools]
include-package-data = true
