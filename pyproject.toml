[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermit-harness"
version = "0.1.0"
description = "Train harness adapters: templates, Evolvers, a Trainer and evolving tasks; deploy adapters into Codex and Claude Code"
readme = "README-pypi.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest"]
# The gepa, skillopt and harness2_upstream Evolvers need packages pinned to Git commits; PyPI does not accept such
# references in package metadata, so they are requirements-gepa.txt, requirements-skillopt.txt and
# requirements-harness2.txt (python -m pip install -e . -r requirements-<name>.txt).

[project.scripts]
hermit = "hermit.cli:main"

[project.urls]
Homepage = "https://github.com/Infini-AI-Lab/hermit"
Documentation = "https://github.com/Infini-AI-Lab/hermit/tree/main/docs"
Issues = "https://github.com/Infini-AI-Lab/hermit/issues"
Changelog = "https://github.com/Infini-AI-Lab/hermit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["hermit*"]

[tool.setuptools.package-data]
hermit = ["defaults.yaml", "backends.yaml", "algorithms/evolvers/**/*", "algorithms/templates/**/*",
          "algorithms/templates/**/.agents/**/*", "algorithms/templates/**/.codex/**/*"]   # globs skip dot-directories

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools]
include-package-data = true
