data:
  tasks: ../utils/data/full-test-v1/tasks.jsonl
  train: ../utils/data/full-test-v1/train.txt
  test: ../utils/data/full-test-v1/test.txt
  step_size: 57
  shuffle: false
task_info: ../utils/task-info
template: she@1.0
agent:
  name: ../utils/bridge.py:run
  concurrency: 1
  timeout_min: 10
  params:
    benchmark_version: v1.2.2
    max_iters: 25
    logs: runs/she-episodes
    hook_runtime: she
    episode_timeout_s: 900
    auditor:
      enabled: true
      max_calls: 8
      max_chars: 16000
      max_tokens: 1024
      timeout_s: 45
  base: direct
  model: vllm/nvidia/nvidia/nemotron-3.5-lightning
judge:
  path: ../utils/judge.py
evolver:
  name: she
  params:
    proposer: llm
    debugger: llm
llm: vllm/nvidia/nvidia/nemotron-3.5-lightning
environment:
  runner: host
sandbox:
  enforce: required
  evolver:
    allowed_hosts: [your-model-service.example]
trainer:
  allow_early_stop: true
  run_name: agentdyn-she
  output_dir: runs
  epochs: 20
  call_timeout_min: 30
  budget:
    hours: 1
