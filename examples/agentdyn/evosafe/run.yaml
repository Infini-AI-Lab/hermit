data:
  tasks: ../utils/data/tasks.jsonl
  train: ../utils/data/train.txt
  val: ../utils/data/val.txt
  test: ../utils/data/test.txt
  step_size: 4
  shuffle: false
task_info: ../utils/task-info
template: evosafe@1.0
agent:
  name: ../utils/bridge.py:run
  base: direct
  model: openai/gpt-4o-mini-2024-07-18
  concurrency: 1
  timeout_min: 10
  params:
    benchmark_version: v1.2.2
    max_iters: 15
    logs: runs/episodes
judge:
  path: ../utils/judge.py
evolver:
  name: evosafe
  params:
    max_clean_drop: 0.0
    min_improvement: 0.0
# Configure llm (the proposer) with your own backend before training.
llm: null
environment:
  runner: host                      # the bridge runs learned hooks in Docker containers of their own;
                                    # the pipeline starts them, so it runs in the Trainer's process
sandbox:
  enforce: required
  evolver:
    allowed_hosts: [api.openai.com]
trainer:
  run_name: agentdyn-shopping
  output_dir: runs
  epochs: 1
  call_timeout_min: 30
  budget:
    hours: 1
