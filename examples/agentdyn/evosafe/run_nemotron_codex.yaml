    robustness_task_ids: []
    mechanism_schedule: []
    reuse_rollout_parent: true
    parent_error_policy: conservative_bounds
    candidate_error_policy: worst_case_bounds
    role_retries: 1
    review_revisions: 2
  codex:
    model: gpt-6-sol
    effort: high
    web_search: false
    timeout_s: 1500
    codex_sandbox: read-only
    args:
    - --disable
    - shell_tool
    - --disable
    - unified_exec
    - --disable
    - multi_agent
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - skill_search
    - --disable
    - image_generation
environment:
  runner: host                      # the bridge runs learned hooks in Docker containers of their own;
                                    # the pipeline starts them, so it runs in the Trainer's process
sandbox:
  evolver:                          # the roles sign in with the user's own Codex login (copied into each session,
    allowed_hosts: [chatgpt.com, auth.openai.com, api.openai.com]   # removed after it: a recorded exception); its hosts
trainer:
  run_name: agentdyn-evosafe-codex
  output_dir: runs
  epochs: 1
  call_timeout_min: 480
  budget:
    hours: 12
  tree_dir: runs/trees/evosafe-codex
