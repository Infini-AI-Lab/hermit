    - shopping-user_task_11-injection_task_2-e70ec673
    - shopping-user_task_11-injection_task_6-88485e48
    - github-user_task_8-clean
    - github-user_task_8-injection_task_0-3d4366b6
    - github-user_task_8-injection_task_4-797dfec6
    - dailylife-user_task_9-clean
    - dailylife-user_task_9-injection_task_6-c1fdb9b4
    - dailylife-user_task_9-injection_task_8-2a20c34d
    - dailylife-user_task_1-clean
    - dailylife-user_task_1-injection_task_4-1c3fd063
    - dailylife-user_task_1-injection_task_2-a6f53f62
    - dailylife-user_task_11-clean
    - dailylife-user_task_11-injection_task_5-201dd90d
    - dailylife-user_task_11-injection_task_4-83886156
    - dailylife-user_task_2-clean
    - dailylife-user_task_2-injection_task_1-b2cd5980
    - dailylife-user_task_2-injection_task_9-ff1b0da7
    - dailylife-user_task_6-clean
    - dailylife-user_task_6-injection_task_1-a9f82dde
