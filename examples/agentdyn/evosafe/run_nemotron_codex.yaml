# Nemotron 3.5 Lightning victim with Codex defense-search roles.
data:
  tasks: ../utils/data/full-test-v1/tasks.jsonl
  train: ../utils/data/full-test-v1/train.txt
  test: ../utils/data/full-test-v1/test.txt
  step_size: 57
  shuffle: false
task_info: ../utils/task-info
template: evosafe@1.0
agent:
  name: ../utils/bridge.py:run
  base: direct
  model: vllm/nvidia/nvidia/nemotron-3.5-lightning
  concurrency: 12
  timeout_min: 15
  params:
    episode_timeout_s: 900
    hook_timeout_s: 90
    hook_image: python@sha256:6b25cbe6577518889d553cdd5a5da97d259348d8f6e45b527dd731caaba27a07
    benchmark_version: v1.2.2
    max_iters: 25
    max_tokens: 8192
    temperature: 0.0
    request_timeout_s: 120
    max_retries: 4
    logs: runs/codex-episodes
    auditor:
      enabled: true
      max_calls: 4
      max_chars: 8000
      max_tokens: 2048
      timeout_s: 45
judge:
  path: ../utils/judge.py
evolver:
  name: evosafe
  base: codex
  params:
    min_improvement: 0.07
    validation_tolerance: 0.07
    search_mode: roles
    max_proposals: 3
    gate_mode: source
    cascade_sizes:
    - 12
    - 57
    evaluation_repeats: 1
    eval_task_ids:
    - shopping-user_task_0-clean
    - github-user_task_4-clean
    - dailylife-user_task_3-clean
    - shopping-user_task_0-injection_task_0-fa88dd03
    - github-user_task_4-injection_task_0-7517e44b
    - dailylife-user_task_3-injection_task_0-5cc9b8be
    - shopping-user_task_0-injection_task_1-8db1f166
    - github-user_task_4-injection_task_1-01330669
    - dailylife-user_task_3-injection_task_1-9b285374
    - shopping-user_task_2-clean
    - github-user_task_17-clean
    - dailylife-user_task_0-clean
    - shopping-user_task_2-injection_task_2-905a440c
    - github-user_task_17-injection_task_2-8ccc1edd
    - dailylife-user_task_0-injection_task_2-7b48a4c9
    - shopping-user_task_2-injection_task_3-2b63f1b6
    - github-user_task_17-injection_task_3-8ef3f2f4
    - dailylife-user_task_0-injection_task_3-2c7c977e
    - shopping-user_task_8-clean
    - shopping-user_task_8-injection_task_0-5eb6cb5d
    - shopping-user_task_8-injection_task_7-9ffce555
