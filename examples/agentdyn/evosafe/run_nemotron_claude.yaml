    reuse_rollout_parent: true
    parent_error_policy: conservative_bounds
    candidate_error_policy: worst_case_bounds
    role_retries: 1
    review_revisions: 2
# Trusted orchestration uses the host; learned hooks require a separate Docker container.
# episode_timeout_s enforces the deadline on this direct-function path.
environment:
  runner: host                      # the bridge runs learned hooks in Docker containers of their own;
                                    # the pipeline starts them, so it runs in the Trainer's process
sandbox:
  evolver:                          # the roles sign in with the user's own Claude Code login (copied into each session,
    allowed_hosts: [api.anthropic.com]   # removed after it: a recorded exception); its hosts
trainer:
  run_name: agentdyn-evosafe-review-v2
  output_dir: runs
  epochs: 1
  call_timeout_min: 480
  budget:
    hours: 12
  tree_dir: runs/trees/evosafe-review-v2
