# Nemotron 3.5 Lightning victim: 57 train / 54 validation / 186 test cases.
# Claude Code roles, full TRAIN scoring, bounded error handling, 12 concurrent victim episodes.
data:
  tasks: ../utils/data/full-test-v1/tasks.jsonl
  train: ../utils/data/full-test-v1/train.txt
  val: ../utils/data/full-test-v1/val.txt
  test: ../utils/data/full-test-v1/test.txt
  step_size: 57
  shuffle: false
task_info: ../utils/task-info
template: evosafe@1.0
agent:
  name: ../utils/bridge.py:run
  base: direct
  model: vllm/nvidia/nvidia/nemotron-3.5-lightning
  concurrency: 12
  timeout_min: 15
  params:
    episode_timeout_s: 900
    hook_timeout_s: 90
    hook_image: python@sha256:6b25cbe6577518889d553cdd5a5da97d259348d8f6e45b527dd731caaba27a07
    # The endpoint and credentials belong in your local Hermit backend settings.
    benchmark_version: v1.2.2
    max_iters: 25
    max_tokens: 8192
    temperature: 0.0
    request_timeout_s: 120
    max_retries: 4
    logs: runs/review-v2-episodes
    auditor:
      enabled: true
      max_calls: 4
      max_chars: 8000
      max_tokens: 2048
      timeout_s: 45
judge:
  path: ../utils/judge.py
evolver:
  name: evosafe
  base: claude
  claude:
    model: claude-opus-5-5
    web_search: false
    timeout_s: 1500
  params:
    min_improvement: 0.07
    validation_tolerance: 0.07
    search_mode: roles
    max_proposals: 3
    gate_mode: source
    cascade_sizes:
    - 12
    - 57
    evaluation_repeats: 1
