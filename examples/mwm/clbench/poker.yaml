# MWM on the CL-Bench poker venue: one order's 120-hand stream (104 hands reach the host; prepare.py lists them),
# one MWM block per 5 host hands (learn_every 5), the default schedule's opponents. Started per order by
# `launch.sh poker`, which sets the per-order paths. The venue metric (bb/hand over all 120 hands) is in
# <task workdir>/outcomes.jsonl.
data:
  tasks: ../../tasks/clbench/poker/tasks.jsonl
  train: ../../tasks/clbench/poker/splits/order0.txt         # launch.sh: order<i>.txt
  step_size: 5                                               # = learn_every (prepare.py --step-size 5)
  shuffle: false
task_info: ../../tasks/clbench/poker/task-info
pipeline:
  run: ../../tasks/clbench/poker/pipeline.py:run
  concurrency: 1
judge:
  path: ../../tasks/clbench/poker/judge.py
template: mwm
evolver:
  name: mwm
  params:
    model: accounts/fireworks/models/glm-5p3-flash
    args: []                       # launch.sh: the provider through the learner's meter, reasoning effort high
    evidence: null                 # launch.sh: <task workdir>/evidence
    block_size: 5                  # the final 4-hand block gets no session, as natively
evolver_access:
  environment: []                  # launch.sh: [<task workdir>/evidence]
  tools: []                        # the poker venue declares no channel
sandbox:
  enabled: true
  network: none                    # the learner's own namespace forwards only its meter and the tool gate
  allow: []
  env: [HA_FW_KEY, MW_TOOLSRV]      # the provider key for codex; the channel client's URL (the Evolver's tool gate)
trainer:
  run_name: null
  output_dir: runs
  epochs: 1
  call_timeout_min: 130            # first step worst case: bootstrap + its retry + review + its retry, 30 min each
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 48}   # a ceiling only; native runs had none
