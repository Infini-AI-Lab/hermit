# smoke.yaml with the models changed and nothing else: GPT-5.6-Luna at medium effort acts and learns on the
# machine's own ChatGPT login (`codex login`; no API key). Started by launch.sh: ASPIRE_CONFIG=smoke_luna.yaml
# ./launch.sh (its seeds are the smoke's).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt
  test: ../utils/splits/smoke_rerun.txt   # `launch.sh eval`: the tasks again, with an adapter given
  step_size: 1
  shuffle: false
task_info: ../utils/task-info
agent:
  base: codex
  concurrency: 1
  params:
    prompt: ../utils/agent/task.py:prompt   # a method-neutral acting prompt: the task, the workspace, what is scored
    prepare: ../utils/agent/task.py:prepare  # the engine's workspace, without ASPIRE's method pages
    answer: ../../aspire_robosuite/utils/agent/task.py:answer
    collect: ../../aspire_robosuite/utils/agent/task.py:collect
    aspire_root: $ASPIRE_ROOT
    aspire_docs: $ASPIRE_DOCS
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}
  codex:
    web_search: false
    timeout_s: 5400
    codex_sandbox: danger-full-access   # the task sandbox is the boundary; the session reaches bin/sim's service
    shell_env: all                  # only the declared variables are in the sandbox
    project_doc_max_bytes: 65536    # AGENTS.md carries ADAPTER.md (the template caps it at 40,000 bytes)
environment:                        # the task sandbox: the engine's code, the staged docs, the scene-snapshot program
  read:
    - ../utils/agent
    - ../../aspire_robosuite/utils/agent
    - $ASPIRE_DOCS
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/scripts/scene_snapshot.py
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/skills/task-exploration.md
    - $ASPIRE_ROOT/.claude/skills/evosearch/skills/evosearch-iteration.md
  env: [ASPIRE_SIM_URL]             # the host's simulator service (launch.sh): its 127.0.0.1 port is forwarded
judge:
  path: ../../aspire_robosuite/utils/judge.py           # on the host: the program once on the held-out seeds
template: prompt-only@1.0
evolver:
  name: codex                       # the built-in Codex AgentEvolver: it revises ADAPTER.md after each task
  resume: false
  params:
    args: []
    model: gpt-5.6-luna
    login: chatgpt
    effort: medium
    home: []
    tools: [check_spec]
sandbox:
  enabled: true
  enforce: required
trainer:
  run_name: smoke-libero-prompt-only-luna
  epochs: 1
  call_timeout_min: 60
  budget: {usd: null, hours: 8}      # the login's plan has no price
eval:
  repeats: 1
