# Agent smoke: the Codex AgentEvolver with GLM 5.3 Flash; 4 training questions in 2 steps.
data:
  tasks: ../../tasks/officeqa/tasks.jsonl
  train: ../../tasks/officeqa/splits/smoke_train.txt
  test: ../../tasks/officeqa/splits/smoke_test.txt
  step_size: 2
task_info: ../../tasks/officeqa/task-info/
pipeline:
  run: ../../tasks/officeqa/pipeline.py:run
  concurrency: 4
judge:
  path: ../../tasks/officeqa/judge.py
template: prompt-only@1.0
evolver:
  name: codex_glm
  resume: true
llm:
  base_url: https://api.fireworks.ai/inference/v1
  model: accounts/fireworks/models/glm-5p3-flash
  api_key_env: FIREWORKS_API_KEY
  price: {input: 0.15, cached_input: 0.03, output: 0.50}
sandbox:
  enabled: true
  network: restricted
  allow: [https://api.fireworks.ai]
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: [FIREWORKS_API_KEY]   # the Codex Evolver reaches GLM with it; nothing else is passed
trainer:
  run_name: codex-smoke
  output_dir: runs
  epochs: 1
  budget: {usd: 3, hours: 1}
  call_timeout_min: 15
