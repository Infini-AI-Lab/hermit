# The prompt-only baseline on the CL-Bench database venue: the same host, stream, cadence and scoring as
# ../../mwm/clbench/database.yaml (one step per question, accuracy, unlimited host queries), with the prompt-only
# template (one learned ADAPTER.md, served to the host as its context, no tools) and the built-in Codex Evolver
# (one fresh Codex session per step, GLM 5.3 Flash through the learner's meter, reasoning effort high).
# Started per order by `launch.sh database`, which sets the per-order paths and the learner's provider arguments.
data:
  tasks: ../../tasks/clbench/database/tasks.jsonl
  train: ../../tasks/clbench/database/splits/order0.txt      # launch.sh: order<i>.txt
  step_size: 1                                               # one step per question (prepare.py --step-size 1)
  shuffle: false                                             # the stream's own order
task_info: ../../tasks/clbench/database/task-info
pipeline:
  run: ../../tasks/clbench/database/pipeline.py:run
  concurrency: 1
judge:
  path: ../../tasks/clbench/database/judge.py
template: prompt-only@1.0
evolver:
  name: codex_glm                  # ./codex_glm: the built-in Codex AgentEvolver with GLM 5.3 Flash
  resume: false                    # a fresh session every step, as the MWM learner has
  params:
    args: []                       # launch.sh: the provider through the learner's meter, reasoning effort high
sandbox:
  enabled: true
  network: restricted              # the learner's meter is on the loopback; the allowlist proxy refuses everything else
  allow: []
  read: []
  env: [HA_FW_KEY]                 # the provider key for codex; nothing else is passed
trainer:
  run_name: null                   # launch.sh: <tag>-o<i>
  output_dir: runs
  epochs: 1
  call_timeout_min: 35
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 48}   # a ceiling only
