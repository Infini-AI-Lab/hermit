# The prompt-only baseline on ServeLearnBench retail_l3: the same stream, cadence, host and scoring as
# ../../mwm/servelearnbench/retail_l3.yaml, with the prompt-only template (one learned ADAPTER.md, served to the host
# as its context, no tools) and the Codex Evolver of the CL-Bench baseline (one fresh session per step, GLM 5.3 Flash
# through the learner's meter, reasoning effort high, tools gated to check_spec). Started by `launch.sh retail_l3`.
data:
  tasks: ../../tasks/servelearnbench/tasks.jsonl
  train: ../../tasks/servelearnbench/splits/serving.txt      # launch.sh: splits/smoke_serving.txt for a smoke
  test: ../../tasks/servelearnbench/splits/test_w0.txt       # windows.py: test_w<w>.txt per window
  step_size: 12                                              # = prepare.py --block (the benchmark's update cadence)
  shuffle: false                                             # the stream's own order
task_info: ../../tasks/servelearnbench/task-info
pipeline:
  run: ../../tasks/servelearnbench/pipeline.py:run
  concurrency: 12                                            # the cases of one block, in parallel
judge:
  path: ../../tasks/servelearnbench/judge.py
template: prompt-only@1.0
evolver:
  name: ../clbench/codex_glm       # the built-in Codex AgentEvolver with GLM 5.3 Flash, tools gated to check_spec
  resume: false                    # a fresh session every step
  params:
    args: []                       # launch.sh: the provider through the learner's meter, reasoning effort high
    hide: ["module:servelearnbench"]   # the benchmark's evaluator and test generator live in the installed package
sandbox:
  enabled: true
  network: restricted              # the learner's meter is on the loopback; the allowlist proxy refuses everything else
  allow: []
  read: []
  env: [HA_FW_KEY]                 # the provider key for codex; nothing else is passed
trainer:
  run_name: null                   # launch.sh: <tag>
  output_dir: runs
  epochs: 1
  call_timeout_min: 35
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 72}   # a ceiling only
