policy_name: hermit_program
protocol: ws
host: localhost
port: null
bench_name: null
task_name: null
ckpt_name: null
env_cfg_type: null
seed: null
action_type: null
gpu_id: null
eval_batch: false        # one environment at a time: a program keeps its state across the steps of one episode
