# smoke.yaml with the models changed and nothing else: GPT-5.6-Luna at medium effort acts and learns on the machine's
# own ChatGPT login (`codex login`; no API key). Started by launch.sh: ROBODOJO_CONFIG=smoke_luna.yaml ./launch.sh
# (its layouts are the smoke's).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt
  test: ../utils/splits/smoke.txt     # `launch.sh eval`: the tasks again, with an adapter given
  step_size: 1
  shuffle: false
task_info: ../utils/task-info
agent:
  base: codex
  concurrency: 1                    # one simulator: an evaluation takes a GPU
  params:
    prompt: ../utils/agent/task.py:prompt
    prepare: ../utils/agent/task.py:prepare
    answer: ../utils/agent/task.py:answer
    collect: ../utils/agent/task.py:collect
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}
  codex:
    web_search: false
    timeout_s: 5400
    codex_sandbox: danger-full-access   # the task sandbox is the boundary; the session reaches bin/sim's service
    shell_env: all                      # only the declared variables are in the sandbox
environment:                        # the task sandbox: the actor's code and the interface page, nothing of RoboDojo
  read:
    - ../utils/agent
  env: [ROBODOJO_SIM_URL]           # the host's simulator service (launch.sh): its 127.0.0.1 port is forwarded
judge:
  path: ../utils/judge.py           # on the host: the program on the held-out layout sets
template: prompt-only@1.0
evolver:
  name: codex                       # the built-in Codex AgentEvolver
  resume: false
  params:
    args: []
    model: gpt-5.6-luna
    login: chatgpt
    effort: medium
    home: []
    tools: [check_spec]
sandbox:
  enabled: true
  enforce: required
trainer:
  run_name: smoke-robodojo-prompt-only-luna
  epochs: 1
  call_timeout_min: 60
  budget: {usd: null, hours: 8}      # the login's plan has no price
eval:
  repeats: 1
