# OfficeQA in the SkillOpt paper's setting with the GEPA Evolver (the paper's GEPA settings are not published): GEPA's
# default reflection minibatch of 3, Pareto selection over the 24 validation questions, 4 epochs over the 50 training
# questions. GLM 5.3 Flash acts.
data:
  tasks: ../../tasks/officeqa_paper/tasks.jsonl
  train: ../../tasks/officeqa_paper/splits/train.txt
  val: ../../tasks/officeqa_paper/splits/val.txt
  test: ../../tasks/officeqa_paper/splits/test.txt
  step_size: 3
  shuffle_seed: 42
task_info: ../../tasks/officeqa_paper/task-info/
pipeline:
  run: ../../tasks/officeqa_paper/pipeline.py:run
  concurrency: 8
judge:
  path: ../../tasks/officeqa_paper/judge.py
template: prompt-only@1.0
start_from: ../../tasks/officeqa_paper/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: gepa
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  base_url: https://api.fireworks.ai/inference/v1
  model: accounts/fireworks/models/glm-5p3
  api_key_env: FIREWORKS_API_KEY
  price: {input: 1.40, cached_input: 0.26, output: 4.40}
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: [https://api.fireworks.ai]
  read: []
  env: [FIREWORKS_API_KEY]
trainer:
  run_name: paper-gepa
  output_dir: runs
  tree_dir: runs/trees/paper-gepa       # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: 40, hours: 30}
  call_timeout_min: 60
eval:
  repeats: 3                 # the target samples: three passes over the test questions
