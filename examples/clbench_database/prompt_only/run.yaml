# The prompt-only baseline on the CL-Bench database venue: the same host, stream, cadence and scoring as
# ../mwm/run.yaml (one step per question, accuracy, unlimited host queries), with the prompt-only
# template (one learned ADAPTER.md, served to the host as its context, no tools) and the built-in Codex Evolver
# (one fresh Codex session per step, GLM 5.3 Flash through the learner's meter, reasoning effort high).
# Started per order by `launch.sh`, which sets the per-order paths and the learner's provider arguments.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/order0.txt      # launch.sh: order<i>.txt
  step_size: 1                                               # one step per question (prepare.py --step-size 1)
  shuffle: false                                             # the stream's own order
task_info: ../utils/task-info
agent:
  name: ../utils/agent/agent.py:CLBenchDatabaseAgent
  concurrency: 1
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
evolver:
  name: codex                      # the built-in Codex AgentEvolver, with GLM 5.3 Flash through the learner's meter
  resume: false                    # a fresh session every step, as the MWM learner has
  params:
    args: []                       # launch.sh: reasoning effort high (the provider settings come from the model's backend)
    model: fireworks/accounts/fireworks/models/glm-5p3-flash   # launch.sh: the learner's backend through its meter
    home: []                       # no login files: the provider key is the backend's variable
    tools: [check_spec]            # no run_agent, llm or budget: the MWM learner of this venue has none either
    hide: []                       # the framework's examples, tests, docs and .git
sandbox:
  enabled: true
  network: restricted              # the learner's meter is on the loopback; the allowlist proxy refuses everything else
  allow: []
  read: []
  env: []                          # the learner's model key variable is always passed; nothing else is
  profiles:                        # the agent's sandbox (rollout; eval and check take it too); launch.sh sets both
    rollout: {read: [$MWM_CLBENCH], write: [$MWM_TASK_WORKDIR]}   # CL-Bench and its .venv; the task's directory
trainer:
  run_name: null                   # launch.sh: <tag>-o<i>
  output_dir: runs
  epochs: 1
  call_timeout_min: 35
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 48}   # a ceiling only
