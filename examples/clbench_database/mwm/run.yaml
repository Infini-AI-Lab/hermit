# MWM on the CL-Bench database venue: one order's 40-question stream, one MWM block per question (learn_every 1),
# accuracy scoring, unlimited host queries. Started per order by `launch.sh`, which sets the per-order paths.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/order0.txt      # launch.sh: order<i>.txt
  step_size: 1                                               # one block per question (prepare.py --step-size 1)
  shuffle: false                                             # the stream's own order
task_info: ../utils/task-info
agent:
  name: ../utils/agent/agent.py:CLBenchDatabaseAgent
  concurrency: 1
judge:
  path: ../utils/judge.py
template: mwm
evolver:
  name: mwm
  params:
    model: fireworks/accounts/fireworks/models/glm-5p3-flash   # launch.sh: the learner's backend through its meter
    args: []                       # launch.sh: reasoning effort high (the provider settings come from the model's backend)
    evidence: null                 # launch.sh: <task workdir>/evidence
    block_size: 1
    learner_tools: []             # no MCP tool: the channel is the native shell client /environment/bin/task-env
evolver_access:
  environment: []                  # launch.sh: [<task workdir>/evidence]
  tools:
    - name: sql
      description: Run one read-only SQL statement (SELECT/WITH/PRAGMA/EXPLAIN) against the bound environment
        database. Rows and characters are capped by the service; every statement is logged to the session.
        Available only when the session bound `sql`.
      entrypoint: sql_tool.py:sql
      input_schema: {type: object, properties: {query: {type: string}}, required: [query], additionalProperties: false}
      output_schema: {type: object}
environment:                         # the task sandbox: the host runner, clbench's checkout and venv
  read: [../utils/agent, $MWM_CLBENCH]
  write: [$MWM_TASK_WORKDIR]       # the run's task directory: evidence, host records
  env: ["MWM_*", "CLB_*", "MW_*"]   # the launcher's settings (launch.sh)
                                   # + the host's litellm key variable (launch.sh): the benchmark's own loop calls
                                   # its model, the recorded exception (docs/developer/sandbox-design.md)
sandbox:
  evolver:
    env: [MW_TOOLSRV]
trainer:
  run_name: null                   # launch.sh: <tag>-o<i>
  output_dir: runs
  epochs: 1
  call_timeout_min: 130            # first step worst case: bootstrap + its retry + review + its retry, 30 min each
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 48}   # a ceiling only; native runs had none
