# OfficeQA with Evo-Harness, train / test, in the GPT-5.6-Luna setting (the README's second column): the
# harness is compiled over the 50 training questions in batches of 16, and the last harness is evaluated frozen on the
# 172 test questions. The paper's own protocol is stream_codex_luna.yaml. GPT-5.6-Luna at medium effort acts and learns
# on the machine's own ChatGPT login (`codex login`; no API key). The image and the egress proxy: the recipe's "The
# Flash row with GPT-5.6-Luna".
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  test: ../utils/splits/test.txt
  step_size: 16                        # the paper's batch
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 16                      # the paper's workers
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-evo-harness-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 409600      # 400 KiB: the skill with the general skills, past Codex's default 32 KiB it
                                       # would cut AGENTS.md (deploy refuses that)
judge:
  path: ../utils/judge.py
template: evo-harness@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: evo_harness
  params:
    feedback_level: standard
llm:                                   # the reflections and the curators: GPT-5.6-Luna at medium effort, the acting model
  cli: codex                           # only Codex reaches the model: one session per chat call (base/endpoint.py)
  model: gpt-5.6-luna
  login: chatgpt
  effort: medium
  web_search: false
  isolation: sandbox                   # a bubblewrap sandbox of its own: its empty workspace, the login's hosts
  timeout: 3600                        # a Codex session answers more slowly than a chat completion
environment:                         # the acting agent: Codex in a container of its own
  image: "officeqa-codex:0.164.0"
  container: {"network": "oq-sandbox", "proxy": "http://oq-egress-login:3128"}
sandbox:
  enabled: true
trainer:
  run_name: luna-evo-harness
  output_dir: runs
  tree_dir: runs/trees/luna-evo-harness
  epochs: 1
  budget: {usd: null, hours: 24}
  call_timeout_min: 240
eval:
  repeats: 1
