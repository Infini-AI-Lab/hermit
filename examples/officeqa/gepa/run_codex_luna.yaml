# OfficeQA with the GEPA Evolver on the Flash row with GPT-5.6-Luna (the README's second column): run_codex_flash.yaml
# with the models changed and nothing else of the protocol. GPT-5.6-Luna at medium effort acts and learns on the
# machine's own ChatGPT login (`codex login`; no API key): the acting agent is Codex on the login (`login: chatgpt`),
# and the learner is the same model, one Codex session per chat call (`llm: {cli: codex}`). Sessions on the login
# share the plan: the files under ~/.cache/hermit/codex-login/plan/ pause them, cap the plan's usage and the sessions
# at once (hermit.agent.base.login). The image holds the machine's standalone Codex
# (docker/codex/Dockerfile.standalone) and the egress proxy lets through chatgpt.com and auth.openai.com (the login's
# refresh): the recipe's "The Flash row with GPT-5.6-Luna". (Ported from PR #54.)
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt
  test: ../utils/splits/test.txt
  step_size: 3
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 8
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-codex-actor-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 65536       # 64 KiB: the skill (up to 40 KB) with the deployment's notes; past
                                       # Codex's default 32 KiB it would cut AGENTS.md (deploy refuses that)
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.164.0", network: oq-sandbox, proxy: "http://oq-egress-login:3128"}
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: gepa
llm:                                   # the learner: GPT-5.6-Luna at medium effort, the acting model
  cli: codex                           # only Codex reaches the model: one session per chat call (base/endpoint.py)
  model: gpt-5.6-luna
  login: chatgpt
  effort: medium
  web_search: false
  isolation: container
  container: {image: "officeqa-codex:0.164.0", network: oq-sandbox, proxy: "http://oq-egress-login:3128"}
  timeout: 3600                        # a Codex session answers more slowly than a chat completion
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: luna-gepa
  output_dir: runs
  tree_dir: runs/trees/luna-gepa       # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: null, hours: null}
  call_timeout_min: 180       # Codex sessions are slower
eval:
  repeats: 1                 # one pass over the test questions (the README table: three)
