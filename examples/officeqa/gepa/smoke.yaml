# Smoke: 4 training questions in 2 steps, 2 validation questions, 4 test questions.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  val: ../utils/splits/smoke_val.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  params:                          # the agent's model, named so its key and host are passed into the task sandbox
    model: fireworks/accounts/fireworks/models/glm-5p3-flash   # (agent.py's default model)
  concurrency: 4
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: gepa
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  model: fireworks/accounts/fireworks/models/glm-5p3     # <backend>/<model id>; the price is the backend's
  extra_body: {reasoning_effort: medium}
environment:                         # the task sandbox: the agent's code, its data and the corpus
  read: [../utils/agent, ../utils/data.json, ../utils/documents]
  packages: [skillopt]
sandbox:
  enabled: true
trainer:
  run_name: smoke-gepa
  output_dir: runs
  tree_dir: runs/trees/smoke-gepa       # one adapter tree per run: runs can train side by side
  epochs: 1
  budget: {usd: 5, hours: 3}
  call_timeout_min: 60
eval:
  repeats: 3                 # the target samples: three passes over the test questions
