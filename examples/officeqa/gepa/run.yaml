# OfficeQA with the GEPA Evolver: one GEPA iteration per step of 3 training questions; candidates are scored on
# the 13 validation questions. GLM 5.3 Flash for acting and reflecting.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt
  test: ../utils/splits/test.txt
  step_size: 3               # GEPA's reflection minibatch
task_info: ../utils/task-info/
model: fireworks/accounts/fireworks/models/glm-5p3-flash   # the run's model: the react agent and the `llm` tool; <backend>/<model id>
agent:
  name: react     # the built-in tool-calling agent: no pipeline code for this task
  concurrency: 10
  params:
    prompt: ../utils/agent/prompt.md
    tools: ../utils/tools.py
    user: "{question}"
    max_turns: 24
    max_tokens: 16384
    max_output_tokens: 65536
    temperature: 0.6
    answer_tag: FINAL_ANSWER
    logs: .logs
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
evolver:
  name: gepa
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's sandbox (rollout; eval and check take it too)
    rollout: {read: [../utils/prepared_agent]}   # the corpus (prepare.py links it); the answers beside it stay out
trainer:
  run_name: officeqa-gepa
  output_dir: runs
  epochs: 1
  budget: {usd: 30, hours: 12}
  call_timeout_min: 60
