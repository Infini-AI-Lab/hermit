# OfficeQA in the SkillOpt paper's setting with the GEPA Evolver, the Codex harness through Harbor: as
# gepa/run_codex.yaml (GLM 5.3 Flash acts in Codex, the skill as AGENTS.md, the whole corpus under docs/), but each
# question is a Harbor task (utils/harbor/build_tasks.py) and the session runs in the task's own Harbor environment, a
# container Harbor starts, installs Codex into and verifies (the judge inside the container, utils/harbor/judge.py,
# which reads the session's stream Hermit hands it in /logs/agent), instead of environment.image; the Codex agent
# deploys the adapter there as hermit deploy --host codex does, its ADAPTER.md (the skill) as AGENTS.md.
# Before: python examples/officeqa/utils/harbor/build_tasks.py, and export OFFICEQA_DOCS_ROOT as it prints (the corpus,
# mounted read-only at /app/docs/root_1). The recipe's "Through Harbor" section has the rest.
data:
  tasks: ../utils/benchmark/.private/harbor_tasks/tasks.jsonl     # the same UIDs as ../utils/benchmark/tasks: the splits apply
  train: ../utils/benchmark/splits/train.txt
  val: ../utils/benchmark/splits/val.txt
  test: ../utils/benchmark/splits/test.txt
  step_size: 3
  shuffle_seed: 42
task_info: ../utils/benchmark/task-info/
agent:
  base: codex
  concurrency: 8
  model: {ref: fireworks/accounts/fireworks/models/glm-5p3-flash, effort: medium}   # the key goes to Codex by name
  codex:
    web_search: false                    # as the Codex route: the answer is in the corpus, not on the web
    version: "0.134.0"                   # the Codex in run_codex.yaml's image (docker/codex/Dockerfile), installed by
                                         # Harbor in each task's environment
environment:
  harbor:
    tasks_dir: ../utils/benchmark/.private/harbor_tasks
    agent_timeout_sec: 3600              # one session's wall clock, as the Codex route's timeout_s
    environment:
      delete: true
      mounts:                            # the corpus, where the instruction's candidate paths point
        - {type: bind, source: $OFFICEQA_DOCS_ROOT, target: /app/docs/root_1, read_only: true}
    jobs_dir: ~/.cache/hermit/officeqa-harbor/jobs
    docker_cleanup: images_keep          # one image for every task: nothing to reclaim between tasks
judge:
  path: hermit.task.verify               # the reward the container's judge wrote (exact match), its feedback line
  name: environment
template: prompt-only@1.0
start_from: ../utils/benchmark/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: gepa
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  model: fireworks/accounts/fireworks/models/glm-5p3     # <backend>/<model id>; the price is the backend's
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
trainer:
  run_name: codex-harbor-gepa
  output_dir: runs
  tree_dir: runs/trees/codex-harbor-gepa   # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: null, hours: null}
  call_timeout_min: 180       # Codex sessions are slower
eval:
  repeats: 3                 # the target samples: three passes over the test questions
