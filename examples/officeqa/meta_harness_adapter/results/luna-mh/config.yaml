template:
  id: meta-harness-adapter
  version: '1.0'
  contract: '2'
  name: Meta-Harness Adapter
tree: <checkout>/examples/officeqa/meta_harness_adapter/runs/trees/luna-mh
branch: luna-mh
start: c9f07eb0dff2dfb7b30cfecd5263bbb88a1099c5
evolver:
  name: meta_harness_adapter
  directory: <checkout>/hermit/algorithms/evolvers/meta_harness_adapter
  class: evolver.py:MetaHarnessAdapterEvolver
  needs: []
  params:
    backend: codex
    prompt: PROPOSE.md
    args: *id001
    model: gpt-5.6-luna
    price: null
    home: *id002
    tools:
    - check_spec
    hide: null
    k: 2
    max_rounds: 6
