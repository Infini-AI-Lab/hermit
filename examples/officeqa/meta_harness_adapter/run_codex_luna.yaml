# OfficeQA with the Meta-Harness Adapter Evolver on the Flash row with GPT-5.6-Luna (the README's second column):
# run.yaml with the models changed and nothing else of the protocol (the 50 training questions as the search set, six
# proposal rounds of k = 2, thirteen epochs, 3,600 s sessions, one test pass; no budget, and a 120-minute call timeout
# for the slower proposer). GPT-5.6-Luna at medium effort acts and proposes on the machine's own ChatGPT login (`codex
# login`; no API key): the acting agent is Codex on the login (`login: chatgpt`), and so is the proposer
# (`evolver.base: codex`), reaching the login through the run's allowlist proxy. Sessions on the login share the plan:
# the files under ~/.cache/hermit/codex-login/plan/ pause them, cap the plan's usage and the sessions at once
# (hermit.agent.base.login). The image holds the machine's standalone Codex (docker/codex/Dockerfile.standalone) and
# the egress proxy lets through chatgpt.com and auth.openai.com: the recipe's "A model on a ChatGPT login". The
# reported run used this Evolver with the deployment before the agent layers (README.md, With GPT-5.6-Luna).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt     # the search set
  test: ../utils/splits/test.txt
  step_size: 50                        # the whole search set per step: each step evaluates one candidate
  shuffle: false
task_info: task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 8
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-mh-codex-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 65536       # 64 KiB, as run.yaml
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.164.0", network: oq-sandbox, proxy: "http://oq-egress-login:3128"}
judge:
  path: ../utils/judge.py
template: meta-harness-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: meta_harness_adapter
  params:                              # Layer 3: the method
    k: 2
    max_rounds: 6                      # six rounds of two: twelve candidates, each evaluated once
  base: codex                          # Layer 2: the proposer is a Codex session
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}   # Layer 1: the proposer's
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com, auth.openai.com]   # the proposer's sessions reach the login's backend and its refresh
  read: [../utils/documents]           # the proposer may read the corpus the agent searches (read only)
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: luna-mh
  output_dir: runs
  tree_dir: runs/trees/luna-mh
  epochs: 13                           # the seed, then twelve candidates
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
  call_timeout_min: 120                # the proposer's session and its checks
eval:
  repeats: 1
