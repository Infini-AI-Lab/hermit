# OfficeQA with the Meta-Harness Adapter Evolver, a demo of one proposal round: the 50 training questions are the
# search set (data.step_size covers them, so a step is an epoch and evaluates one candidate), k = 2 candidates, three
# epochs: the starting adapter, then each candidate in turn; finalize hands back the best mean on the search set. The
# acting agent is Codex 0.162.0 in a container per question (the framework's Codex agent, image
# officeqa-codex:0.162.0) with the adapter deployed as it is (`deploy: files`); GLM 5.3 Flash acts and proposes, at
# medium effort. No test evaluation in the demo.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt     # the search set
  test: ../utils/splits/test.txt
  step_size: 50                        # the whole search set per step: each step evaluates one candidate
  shuffle: false
task_info: task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 8
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    deploy: files                      # ADAPTER.md as AGENTS.md, every other adapter file in the workspace
    reserved: [task.md, docs]          # the names the task's files take
    workspaces: ~/.cache/hermit/officeqa-mh-codex
  model:                               # Layer 1
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.162.0", network: oq-sandbox, proxy: "http://oq-egress:3128"}
judge:
  path: ../utils/judge.py
template: meta-harness-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: meta_harness_adapter
  params:                              # Layer 3: the method
    home: []                           # no login files: the provider key is the backend's variable
    k: 2
    max_rounds: 1                      # the demo: one proposal round
  base: codex                          # Layer 2: the proposer is Codex
  model:                               # Layer 1: the acting model
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: [../utils/documents] # the proposer may read the corpus the agent searches (read only)
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: mh-demo
  output_dir: runs
  tree_dir: runs/trees/mh-demo
  epochs: 3                            # the seed, then the round's two candidates
  budget: {usd: 30, hours: 12}
  call_timeout_min: 75                 # the proposer's session (about an hour) and its checks
eval:
  repeats: 1
