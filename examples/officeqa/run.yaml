# OfficeQA with the prompt-only template and the prompt-only Evolver, GLM 5.3 Flash for acting and learning.
data:
  tasks: tasks.jsonl
  train: splits/train.txt
  val: splits/val.txt
  test: splits/test.txt
  step_size: 10
  shuffle_seed: 0
task_info: task-info/
pipeline:
  run: pipeline.py:run
  concurrency: 10
judge:
  path: judge.py
  name: score
template: prompt-only@1.0
evolver:
  name: prompt_only
llm:
  base_url: https://api.fireworks.ai/inference/v1
  model: accounts/fireworks/models/glm-5p3-flash
  api_key_env: FIREWORKS_API_KEY
  price: {input: 0.15, cached_input: 0.03, output: 0.50}
sandbox:
  enabled: true
  network: restricted
  allow: [https://api.fireworks.ai]
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: [FIREWORKS_API_KEY]   # the Codex Evolver reaches GLM with it; nothing else is passed
trainer:
  run_name: officeqa-prompt-only
  output_dir: runs
  epochs: 2
  save_freq: {steps: null, epochs: 1}
  budget: {usd: 30, hours: 12}
  call_timeout_min: 30
eval:
  repeats: 1
