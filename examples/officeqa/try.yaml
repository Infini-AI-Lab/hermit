# Trial: 12 training questions in 3 steps, 1 epoch; eval on 10 test questions.
data:
  tasks: tasks.jsonl
  train: splits/try_train.txt
  test: splits/try_test.txt
  step_size: 4
task_info: task-info/
pipeline:
  run: pipeline.py:run
  concurrency: 8
judge:
  path: judge.py
template: prompt-only@1.0
evolver:
  name: prompt_only
llm:
  base_url: https://api.fireworks.ai/inference/v1
  model: accounts/fireworks/models/glm-5p3-flash
  api_key_env: FIREWORKS_API_KEY
  price: {input: 0.15, cached_input: 0.03, output: 0.50}
sandbox:
  enabled: true
  network: restricted
  allow: [https://api.fireworks.ai]
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: [FIREWORKS_API_KEY]   # the Codex Evolver reaches GLM with it; nothing else is passed
trainer:
  run_name: try12
  output_dir: runs
  epochs: 1
  budget: {usd: 6, hours: 3}
  call_timeout_min: 15
