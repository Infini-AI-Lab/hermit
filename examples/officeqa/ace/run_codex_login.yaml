# OfficeQA with ACE, offline, everything on the user's own Codex login (a ChatGPT account,
# `codex login`; no API key): the acting agent is SkillOpt's Codex harness with the login copied into each session's
# container (agent.params.login: chatgpt), and ACE's Reflector and Curator are `codex exec` sessions under the same
# login (evolver.params.learner: codex). The model is the login's default unless agent.params.model and
# evolver.params.learner_model name one (for example on the command line: agent.params.model=<name>).
# The egress proxy must let chatgpt.com:443 and auth.openai.com:443 through (README). A subscription has no
# per-token price: costs are recorded as unknown, so the hard budget is in hours.
# Compare against the starting adapter and no adapter evaluated with this same config (same model):
#   hermit eval --config run_codex_login.yaml --adapter seed_adapter / --adapter none
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt
  test: ../utils/splits/test.txt
  step_size: 1
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  params:
    harness: codex
    login: chatgpt                     # the user's Codex login (~/.codex/auth.json, or auth_file)
    model: gpt-6-luna                # GPT-6-Luna (not the login default, gpt-6-astra)
    codex_dir: ~/.cache/hermit/officeqa-ace-login
  concurrency: 4                       # sessions side by side on one account: mind its rate limits
judge:
  path: ../utils/judge.py
template: ace@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: ace
  params:
    learner: codex                     # Reflector and Curator through the same Codex login
    learner_model: gpt-6-luna        # GPT-6-Luna, as the acting agent
    learner_effort: medium
    feedback: true
    max_num_rounds: 3
    total_samples: 50
    val_every: epoch
sandbox:
  enabled: true
  enforce: best_effort                 # macOS: no bubblewrap; acting sessions stay in Docker
  network: restricted
  allow: [chatgpt.com, auth.openai.com]      # the learner's Codex reaches its provider through the allowlist proxy
  read: []
  env: []
  profiles:
    rollout: {enabled: false}   # the agent's role drives Docker; each Codex session is in a container of its own
trainer:
  run_name: login-codex-ace
  output_dir: runs
  tree_dir: runs/trees/login-codex-ace
  epochs: 2
  budget: {usd: null, hours: 24}
  call_timeout_min: 240
eval:
  repeats: 3                 # three passes over the 172 test questions: less rollout noise per question
