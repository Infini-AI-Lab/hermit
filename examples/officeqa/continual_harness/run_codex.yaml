# OfficeQA in the SkillOpt paper's setting (its 50 / 24 / 172 split, exact match) with the Continual Harness Evolver:
# the harness is Codex's own tree (AGENTS.md as the base policy, sub_agents/, .agents/skills/ with executable
# helpers, memory/NOTES.md; the continual-harness template), starting from SkillOpt's initial skill as AGENTS.md
# (where the GEPA, SkillOpt and Harness² runs start too). Each rollout is one `codex exec` session in a container of
# its own (the framework's Codex agent, image officeqa-codex:0.162.0). Every
# training step the Refiner reads the step's trajectories and the judge's feedback and refines the four components in
# place; no validation gate. GLM 5.3 Flash acts and refines, at medium effort; one evaluation pass, as the all-Flash
# GEPA and SkillOpt runs (gepa/run_codex_flash.yaml, skillopt/run_codex_flash.yaml).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  test: ../utils/splits/test.txt
  step_size: 3                         # the Refiner's window: three questions' trajectories per step
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 3
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-ch-codex
  model:                               # Layer 1
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 65536       # 64 KiB: the skill (up to 40 KB) with the deployment's notes; past
                                       # Codex's default 32 KiB it would cut AGENTS.md (deploy refuses that)
judge:
  path: ../utils/judge.py
template: continual-harness@1.1
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: continual_harness
  params:
    feedback: true                     # the judge's verdicts are shown to the Refiner (a decision of this setup)
llm:                                   # the Refiner: GLM 5.3 Flash at medium effort, the acting model
  model: fireworks/accounts/fireworks/models/glm-5p3-flash
  extra_body: {reasoning_effort: medium}
environment:                         # the acting agent: Codex in a container of its own
  image: "officeqa-codex:0.162.0"
  container: {"network": "oq-sandbox", "proxy": "http://oq-egress:3128"}
sandbox:
  enabled: true
trainer:
  run_name: flash-codex-ch
  output_dir: runs
  tree_dir: runs/trees/flash-codex-ch
  epochs: 4                            # as the GEPA and SkillOpt runs: four passes over the 50 training questions
  budget: {usd: null, hours: null}
  call_timeout_min: 120
eval:
  repeats: 1
