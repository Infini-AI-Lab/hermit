# OfficeQA with the Continual Harness Evolver: the Refiner rewrites ADAPTER.md from the rollouts' failure signatures,
# label-free (no validation gate), one refinement per training step. GLM 5.3 Flash acts and refines. This is a
# functional test of the evolver on a prompt-only benchmark; a tool-heavy task shows CH's failure-reflection better.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  test: ../utils/splits/test.txt
  step_size: 3
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  concurrency: 8
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter
evolver:
  name: continual_harness
  params:
    components: [prompt, subagents, skills, memory]
llm:                           # the Refiner model (same role as gepa's optimizer): GLM 5.3 Flash
  model: fireworks/accounts/fireworks/models/glm-5p3-flash
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's model endpoint is always reachable
  read: []
  env: []
  profiles:
    rollout:
      read: [../utils/documents]
      mask: [../utils/.private]
trainer:
  run_name: ch-evolver
  output_dir: runs
  tree_dir: runs/trees/ch-evolver
  epochs: 1
  budget: {usd: 10, hours: 3}
  call_timeout_min: 30
eval:
  repeats: 3
