# Smoke: 4 training questions in 2 steps, 4 test questions. Confirms the Continual Harness evolver runs end to end
# on OfficeQA direct chat (check -> train -> eval), not a measurement. The full run is run.yaml.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  concurrency: 4
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter
evolver:
  name: continual_harness
  params:
    components: [prompt, subagents, skills, memory]
llm:                           # the Refiner model: GLM 5.3 Flash
  model: fireworks/accounts/fireworks/models/glm-5p3-flash
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []
  read: []
  env: []
  profiles:
    rollout:
      read: [../utils/documents]
      mask: [../utils/.private]
trainer:
  run_name: smoke-ch
  output_dir: runs
  tree_dir: runs/trees/smoke-ch
  epochs: 1
  budget: {usd: 3, hours: 1}
  call_timeout_min: 30
eval:
  repeats: 1
