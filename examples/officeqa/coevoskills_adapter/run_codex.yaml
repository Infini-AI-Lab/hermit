# OfficeQA with the CoEvoSkills Adapter on the Flash row (the reproduction guide's first evaluation): GLM 5.3 Flash at
# medium effort acting (Codex in a container per session, the corpus under docs/) and in every upstream role (the
# run's `llm`, the same model). The 50 training questions, four at a time: one step runs the upstream loop once per
# question, in independent workers (they do not see each other's packages); the frozen adapter is evaluated with
# `hermit eval` on the 172 test questions. prepare.py writes the task packages, make_seed.py the starting adapter.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt         # not used: no selection
  test: ../utils/splits/test.txt
  step_size: 4                         # questions per step = evolver.params.workers
  shuffle: false
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 4
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-coevoskills-adapter
  model:                               # Layer 1
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 65536
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.162.0", network: oq-sandbox, proxy: "http://oq-egress:3128"}
judge:
  path: ../utils/judge.py
template: coevoskills-adapter@1.0
start_from: seed_adapter               # make_seed.py: SkillOpt's initial OfficeQA skill as the starting context
evolver:
  name: coevoskills_adapter
  params:
    workers: 4
    deliver: oracle_io.py:deliver      # the acting agent's answer where the hidden test reads it
    path_map: {/root/docs: docs, /root/answer.txt: skill-answer.txt}   # the package container's paths, in the workspace
    # defaults (evolver.yaml): upstream's 5 oracle checks and 120 episodes per question, 7,200 s per question's loop
llm:                                   # every upstream role (Generator, Verifier): the acting model
  model: fireworks/accounts/fireworks/models/glm-5p3-flash
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own
trainer:
  run_name: codex-coevoskills-adapter
  output_dir: runs
  tree_dir: runs/trees/codex-coevoskills-adapter
  epochs: 1
  budget: {usd: null, hours: 72}
  call_timeout_min: 240      # one question's loop (7,200 s, its oracle checks included), all of a step's at once
eval:
  repeats: 1
