# run_luna.yaml with rrsi_eng.json: the same protocol and proposal side, with the selection-side constants of
# upstream's engineering instance (inside the noise band the score counts: w_s = 100, w_c = 2), an arm against the
# coding instance's w_s = 0.
# OfficeQA with the RRSI Adapter Evolver on the Flash row with GPT-5.6-Luna (the README's second column): Codex 0.164.0
# with GPT-5.6-Luna at medium effort acting AND learning on the machine's own ChatGPT login (`codex login`; no API
# key). The evolve set is the 50 training questions with k = 2 trials each (make_rows.py: rows `<id>#<k>`, which the
# agent and judge wrappers in trials.py map back to the question); a step's 100 rollouts evaluate one candidate. H_0
# is SkillOpt's initial skill (make_seed.py). The acting agent is the framework's Codex agent (trials.py) with
# OfficeQA's task functions, in a container per question, deploying each candidate as `hermit deploy` does (ADAPTER.md
# in AGENTS.md, every other file under hermit/rrsi-adapter/ and named there). The proposer is a Codex session on the
# same login in hermit's sandbox (`evolver.base: codex`), reaching the login through the run's allowlist proxy, and so
# are the one-call roles (analyst, digesters, critic), one Codex session per call.
# Sessions on the login share the plan: the files under ~/.cache/hermit/codex-login/plan/ pause them, cap the plan's
# usage and the sessions at once (hermit.agent.base.login). The image holds the machine's standalone Codex
# (docker/codex/Dockerfile.standalone) and the egress proxy lets through chatgpt.com and auth.openai.com: the recipe's
# "A model on a ChatGPT login". RRSI's hyperparameters: rrsi_eng.json (T = 10 rounds of m = 2). After the run,
# `hermit eval` scores H_T once on the 172 test questions; `hermit eval --config run_luna_eng.yaml --adapter
# seed_adapter` scores H_0 the same way. The reported run used this config at commit 859bda9 with, besides
# trainer.run_name and trainer.tree_dir, three settings on the command line: agent.concurrency=6,
# agent.codex.container.proxy=http://oq-egress-chatgpt:3128 (an egress proxy letting through chatgpt.com only) and
# sandbox.allow=[chatgpt.com] (README.md, Result).
data:
  tasks: rows/tasks.jsonl              # make_rows.py: ../utils/tasks.jsonl plus k trial rows per training question
  train: rows/train_k2.txt             # the evolve set: 50 questions x k = 2
  test: ../utils/splits/test.txt
  step_size: 100                       # the whole evolve set per step: each step evaluates one candidate
  shuffle: false
task_info: task-info/
agent:
  name: trials.py:TrialCodexAgent      # Layer 3: the framework's Codex agent on a row's question
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 10                      # the four trainings and the engineering arm ran with agent.concurrency=6
  params:                              # Layer 3: OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-rrsi-codex-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600                    # one session's wall clock, as the Meta-Harness Adapter and stream runs
    project_doc_max_bytes: 65536       # 64 KiB, as every OfficeQA Codex config: past Codex's default 32 KiB it would
                                       # cut AGENTS.md (deploy refuses that)
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.164.0", network: oq-sandbox, proxy: "http://oq-egress-login:3128"}
judge:
  path: trials.py                      # ../utils/judge.py on the row's question
template: rrsi-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: rrsi_adapter
  params:                              # Layer 3: the method
    domain: domain.py:OfficeQADomain
    rrsi: rrsi_eng.json                # the engineering instance's selection side
    role_timeout_s: 1800               # one session of the analyst, a digester or the critic
  base: codex                          # Layer 2: the proposer and the roles are Codex sessions
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}   # Layer 1: theirs
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com, auth.openai.com]   # the proposer's and the roles' sessions reach the login's backend and its
                                          # refresh
  read: []
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: luna-rrsi-eng
  output_dir: runs
  tree_dir: runs/trees/luna-rrsi-eng
  epochs: 30                           # at most 1 + T x m = 21 evaluations, with room for a failed step; the Evolver
                                       # ends the run after round T-1
  allow_early_stop: true
  call_timeout_min: 360                # a round's analysis, two proposer sessions with repairs, the critic and the smokes
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
eval:
  repeats: 1                           # one pass over the test questions
