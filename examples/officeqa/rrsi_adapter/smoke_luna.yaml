# A smoke of run_luna.yaml: the 4 smoke questions x k = 2, one round of two candidates (three steps), real Codex
# sessions on the ChatGPT login for the agent, the proposer and the roles; the 4 smoke test questions for `hermit eval`.
data:
  tasks: rows/tasks.jsonl              # make_rows.py: ../utils/tasks.jsonl plus k trial rows per training question
  train: rows/smoke_k2.txt             # the 4 smoke questions x k = 2
  test: ../utils/splits/smoke_test.txt
  step_size: 8
  shuffle: false
task_info: task-info/
agent:
  name: trials.py:TrialCodexAgent      # Layer 3: the framework's Codex agent on a row's question
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 10                      # the four trainings and the engineering arm ran with agent.concurrency=6
  params:                              # Layer 3: OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-rrsi-codex-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600                    # one session's wall clock, as the Meta-Harness Adapter and stream runs
    project_doc_max_bytes: 65536       # 64 KiB, as every OfficeQA Codex config: past Codex's default 32 KiB it would
                                       # cut AGENTS.md (deploy refuses that)
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.164.0", network: oq-sandbox, proxy: "http://oq-egress-login:3128"}
judge:
  path: trials.py                      # ../utils/judge.py on the row's question
template: rrsi-adapter@1.0
start_from: seed_adapter               # make_seed.py writes it from ../utils/seed_adapter
evolver:
  name: rrsi_adapter
  params:                              # Layer 3: the method
    domain: domain.py:OfficeQADomain
    rrsi: {T: 1, k: 2, m: 2, b_min: 1, b_max: 4, w: 3, m_draft: 1, delta: null, beta0: 0.1, beta1: 25.0, w_s: 0.0, w_c: 15.0, w_n: 0.5, n_prune: 4, repair_rounds: 2, invalid_missing_frac: 0.2, n_fail_traces: 3, n_success_traces: 1}
    role_timeout_s: 1800               # one session of the analyst, a digester or the critic
  base: codex                          # Layer 2: the proposer and the roles are Codex sessions
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}   # Layer 1: theirs
sandbox:
  enabled: true
  network: restricted
  allow: [chatgpt.com, auth.openai.com]   # the proposer's and the roles' sessions reach the login's backend and its
                                          # refresh
  read: []
  env: []
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: smoke-luna-rrsi
  output_dir: runs
  tree_dir: runs/trees/smoke-luna-rrsi
  epochs: 3                            # H_0 and one round of two
  allow_early_stop: true
  call_timeout_min: 360                # a round's analysis, two proposer sessions with repairs, the critic and the smokes
  budget: {usd: null, tokens: null, hours: null}   # the plan has no price per token: nothing to cap in USD
eval:
  repeats: 1                           # one pass over the test questions
