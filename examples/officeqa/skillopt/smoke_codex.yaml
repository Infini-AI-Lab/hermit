# Smoke: 4 training questions in 2 epochs of 2 steps, 2 validation questions, 4 test questions.
# Codex harness: as skillopt/smoke.yaml, but GLM 5.3 Flash acts in the framework's Codex agent (codex exec in a
# workspace-write sandbox in a container per session, the skill as AGENTS.md, the whole corpus under docs/, 3,600 s
# per session). The published Codex-harness numbers were made with SkillOpt's own Codex harness (the skill as
# SKILL.md, 180 s sessions), which this replaces.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  val: ../utils/splits/smoke_val.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 4
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    deploy: tree                       # the skill (or the context tool's context) as AGENTS.md; a Codex tree as is
    workspaces: ~/.cache/hermit/officeqa-codex-actor
  model:                               # Layer 1
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.134.0", network: oq-sandbox, proxy: "http://oq-egress:3128"}
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: skillopt
  params:
    total_steps: 4
    minibatch_size: 2
    merge_batch_size: 2
    analyst_workers: 4
    learning_rate: 4
    min_learning_rate: 2
    lr_scheduler: cosine
    slow_update_samples: 2
    slow_update_gate: true        # the paper gates the slow update on validation
    use_meta_skill: true
    prompt_env: officeqa
    trajectory_view: paper        # trajectories as the paper-time analyst saw them
    promote_final: false          # the paper-time code hands back the best skill as is
    seed: 42
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  model: fireworks/accounts/fireworks/models/glm-5p3     # <backend>/<model id>; the price is the backend's
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: codex-smoke-skillopt
  output_dir: runs
  tree_dir: runs/trees/codex-smoke-skillopt       # one adapter tree per run: runs can train side by side
  epochs: 2
  budget: {usd: null, hours: null}
  call_timeout_min: 90
eval:
  repeats: 3                 # the target samples: three passes over the test questions
