# Smoke: 4 training questions in 2 steps of 2, then eval on the 4 smoke test questions. Settings as run.yaml.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAPaperAgent
  concurrency: 4
judge:
  path: ../utils/judge.py
template: harness2@1.0
start_from: seed_adapter           # SkillOpt's initial OfficeQA skill as a harness2 adapter (make_seed.py)
evolver:
  name: harness2
  params:
    k: 1
    slots: slots.yaml
llm:                           # the optimizer: GLM 5.3 at medium effort, as gepa/ and skillopt/
  model: fireworks/accounts/fireworks/models/glm-5p3
  extra_body: {reasoning_effort: medium}
  timeout: 1800                # long evidence: allow a slow reply rather than retry it
sandbox:
  enabled: true
  network: restricted
  allow: []
  read: []
  env: []
trainer:
  run_name: smoke-harness2
  output_dir: runs
  tree_dir: runs/trees/smoke-harness2
  epochs: 1
  budget: {usd: 5, hours: 3}
  call_timeout_min: 180
eval:
  repeats: 3
