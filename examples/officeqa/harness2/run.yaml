# OfficeQA in the SkillOpt paper's setting (arXiv 2605.23904) with the Harness² Evolver (arXiv 2610.14224). Same split,
# rollout, scorer, seed skill, optimizer model, epochs, budget and eval protocol as gepa/ and skillopt/: GLM 5.3 Flash
# acts, GLM 5.3 at medium effort edits. Harness² is label-free: it reads trajectories and answers, never scores, so it
# takes no validation split (GEPA and SkillOpt select on the 24 validation questions). Each step is one contrastive
# Propose-Probe-Compose round over 5 training questions (k = 1): 3 x 5 probe rollouts and 4 model calls.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  test: ../utils/splits/test.txt
  step_size: 5
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  concurrency: 8
judge:
  path: ../utils/judge.py
template: harness2@1.0
start_from: seed_adapter           # SkillOpt's initial OfficeQA skill as a harness2 adapter (make_seed.py)
evolver:
  name: harness2
  params:
    k: 1
    slots: slots.yaml
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  model: fireworks/accounts/fireworks/models/glm-5p3
  extra_body: {reasoning_effort: medium}
  timeout: 1800                # long evidence: allow a slow reply rather than retry it
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: paper-harness2
  output_dir: runs
  tree_dir: runs/trees/paper-harness2       # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: 40, hours: 30}
  call_timeout_min: 180
eval:
  repeats: 3                 # the target samples: three passes over the test questions
