# OfficeQA with Harness² under the paper's own protocol on the Flash row with GPT-5.6-Luna (the README's second
# column): run_codex.yaml with the models changed and nothing else of the protocol. GPT-5.6-Luna at medium effort acts
# and learns on the machine's own ChatGPT login (`codex login`; no API key): the acting agent is Codex on the login
# (`login: chatgpt`), and so are the editors (`evolver.params.backend: codex`, Codex sessions in place of Claude
# Code's `claude -p`, which the login cannot serve), reaching chatgpt.com through the run's allowlist proxy. Sessions
# on the login share the plan: the files under ~/.cache/hermit/codex-login/plan/ pause them, cap the plan's usage and
# the sessions at once (hermit.agent.base.login). The image holds the machine's standalone Codex
# (docker/codex/Dockerfile.standalone) and the egress proxy lets through chatgpt.com and auth.openai.com (the login's
# refresh): the recipe's "The Flash row with GPT-5.6-Luna". (Ported from PR #54.)
data:
  tasks: ../utils/tasks.jsonl
  train: stream_s0.txt                 # launch.sh: upstream's order of ../utils/splits/test.txt for SEED
  step_size: 1                         # one question per step
  shuffle: false                       # the stream's own order
task_info: ../utils/task-info
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 2                       # the INV and DOM probes of a question run side by side
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    workspaces: ~/.cache/hermit/officeqa-h2-codex-luna
  model:                               # Layer 1
    name: gpt-5.6-luna                 # a Codex model on the machine's ChatGPT login
    login: chatgpt
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 65536       # 64 KiB: the skill (up to 40 KB) with the deployment's notes; past
                                       # Codex's default 32 KiB it would cut AGENTS.md (deploy refuses that)
judge:
  path: ../utils/judge.py
template: harness2-codex@1.1
start_from: seed_adapter_codex         # H0 (launch.sh runs make_seed_codex.py)
evolver:
  name: harness2_upstream
  params:
    model: gpt-5.6-luna                # the editors' model, on the login
    backend: codex                     # the editors are Codex sessions (the login serves no Claude Code)
    login: chatgpt
    effort: medium
    k: 1
    slots: slots_codex.yaml            # names the answer's form (the value alone) and Codex's levers
    sources: sources.py:task_files
    name: officeqa
    leak_globs: ["answers.jsonl", "*.csv", "data.json"]  # not "*private*": "privately held debt" is a skill topic
    verdict_markers: ["' but expected '"]                # the judge's feedback wording
    probe_absent: []                                     # launch.sh: the answer files no session may see
environment:                         # the acting agent: Codex in a container of its own
  image: "officeqa-codex:0.164.0"
  container: {"network": "oq-sandbox", "proxy": "http://oq-egress-login:3128"}
sandbox:
  evolver:
    allowed_hosts: [chatgpt.com, auth.openai.com]
trainer:
  run_name: luna-h2-s0
  output_dir: runs
  epochs: 1
  call_timeout_min: 360                # one question's sessions and executions (executions up to 60 min each), retries included
  save_freq: {steps: null, epochs: 1}
  budget: {usd: 400, tokens: null, hours: null}
