# Upstream Harness²'s prompt slots for OfficeQA answered by Codex (run_codex.yaml): the per-task text its stage prompts
# interpolate. They describe the work, never its measurement: upstream refuses the words benchmark, evaluation, grader,
# rubric and score here. `work` names the deliverable's form, as upstream's own benchmarks do: the final answer is the
# value alone, which is how the task's answers are taken (../utils/task-info/README.md). No session sees an answer.
work: >-
  Answering a question about U.S. Treasury Bulletins (1939-2025). The agent is a Codex session in a workspace:
  `task.md` holds the question, the parsed pages its answer comes from and the bulletin files those pages are in; the
  whole corpus of bulletins (long text renderings of scanned tables) is under `docs/`, to search and read with the
  shell (rg, grep, sed, python3). The agent computes what the question asks and ends with one final answer inside
  <answer>...</answer>: the value itself - one number, date or name, or the list the question asks for - in exactly
  the unit, rounding and list form the question requests. A sentence, label, derivation or caveat is not the value:
  the derivation and the quoted cells belong in the message before the tags.
domain_word: area
deliverable_word: final answer
inv_levers: >-
  The agent works in a shell over its workspace: `task.md`, the candidate files it names and the whole corpus under
  `docs/`. The bulletins are long text renderings of scanned tables, so a run can spend its turns on broad searches
  and long reads, or hand-roll arithmetic over many cells. Look for turns spent before the right table is found,
  reads that miss the needed row or column, arithmetic done in one leap or by hand where a script would be exact,
  commands that fail or repeat, and runs that end without the <answer> tag or with more than the value inside it.
dom_levers: >-
  What a practitioner of Treasury statistics knows: which table of a bulletin reports a kind of figure, how a table's
  headers encode period, basis and unit, how fiscal and calendar years differ, that later issues revise earlier
  figures, and how growth rates, shares, averages and differences are computed and rounded.
yardstick: >-
  A good run finds the table that reports the asked-for figure for the asked-for period and basis, quotes the exact
  cells it uses, does the arithmetic explicitly (in a script when many cells are involved), and gives only the value,
  in the requested unit and rounding, inside <answer>...</answer> well before the time limit.
selection_checks: >-
  One value (or the requested list) in the requested unit and rounding, consistent with the figures quoted in the
  final message.
