# ReHarness under its paper's protocol on the row the other methods share (the recipe's Flash row): the 172 OfficeQA
# test questions as one stream in upstream Harness²'s seed-0 order (stream_s0.txt, the order ../harness2_stream and
# ../continual_harness/stream_codex.yaml ran), one question per step, no training split, no validation, one pass.
# Each question is answered by Codex 0.162.0 in a container of its own (the framework's Codex agent, image
# officeqa-codex:0.162.0, 3,600 s wall clock) with SkillOpt's initial skill and the five
# reflections retrieved for the question as its AGENTS.md; that answer is the question's result, scored before the
# Evolver reads the trajectory. `feedback: false`: the Evolver sees the trajectory and the answer, never the judge's
# verdict or the reference answer, the label footing of Harness² and of ../continual_harness/stream_codex.yaml (the
# paper's own footing is the environment's outcome: `evolver.params.feedback=true` restores it, as a second stream).
# GLM 5.3 Flash acts, reflects and revises at medium effort. The stream's accuracy is the mean of the steps' rollout
# scores (steps.jsonl); no `hermit eval` follows. Started by launch.sh, which puts the embedding model behind a
# loopback relay for the adapter's reader.
data:
  tasks: ../utils/tasks.jsonl
  train: stream_s0.txt                 # upstream Harness²'s seed-0 order of ../utils/splits/test.txt
  step_size: 1                         # one question per step: one ReHarness instance (read, revise, write)
  shuffle: false                       # the stream's own order
task_info: ../utils/task-info/
agent:
  base: codex                          # Layer 2: Codex as a Base Agent (hermit/agent/base/cli.py)
  concurrency: 1                       # one question at a time, and there is no eval
  params:                              # Layer 3: the Acting Agent with OfficeQA's task functions
    prompt: ../utils/prompt.md
    prepare: ../utils/task.py:prepare  # task.md and the corpus under docs/
    answer: ../utils/task.py:answer    # the last <answer>...</answer>
    collect: ../utils/task.py:collect  # task.md into the log
    deploy: tree                       # the skill (or the context tool's context) as AGENTS.md; a Codex tree as is
                                             # past which it silently drops the rest of AGENTS.md
    workspaces: ~/.cache/hermit/officeqa-rh-codex
  model:                               # Layer 1
    ref: fireworks/accounts/fireworks/models/glm-5p3-flash
    effort: medium
  codex:                               # Layer 2: how Codex runs
    web_search: false                  # set explicitly: Codex's hosted search runs past the container
    timeout_s: 3600
    project_doc_max_bytes: 204800           # 200 KiB: five retrieved reflections exceed Codex's default 32 KiB,
    isolation: container               # each session in a container of its own (hermit/agent/base/container.py)
    container: {image: "officeqa-codex:0.162.0", network: oq-sandbox, proxy: "http://oq-egress:3128"}
judge:
  path: ../utils/judge.py
template: reharness
start_from: seed_adapter               # make_seed.py: SkillOpt's initial skill over the reharness template, an empty bank
evolver:
  name: reharness
  params:
    k: 5                               # reflections retrieved and revised per question (the paper: 5)
    embedding: fireworks/accounts/fireworks/models/qwen3-embedding-8b   # launch.sh binds it to its loopback relay
    feedback: false                    # trajectory and answer only: no verdict reaches the agents (the row's footing)
llm:                                   # the reflection and revision agents: the acting model, as the paper's one backbone
  model: fireworks/accounts/fireworks/models/glm-5p3-flash
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
  profiles:                  # the agent's role runs unconfined: it drives Docker (the daemon's socket, the sessions'
    rollout: {enabled: false}   # homes under ~/.cache); each Codex session is in a container of its own (hermit/agent/base/container.py)
trainer:
  run_name: rh-stream-s0
  output_dir: runs
  tree_dir: runs/trees/rh-stream-s0    # one adapter tree per run: runs can train side by side
  epochs: 1                            # one pass over the stream
  save_freq: {steps: null, epochs: 1}
  budget: {usd: 100, tokens: null, hours: null}
  call_timeout_min: 120                # one question's session (up to 60 min), five revisions side by side, one reflection
eval:
  repeats: 1                           # not used: the stream's own answers are the result
