# OfficeQA in the SkillOpt paper's setting with the prompt-only template and the built-in Codex Evolver, as in
# ../../clbench_poker/prompt_only/: after every step of 10 training questions a fresh Codex session with GLM 5.3
# reads the step's trajectories and the judge's feedback and rewrites the skill; 4 epochs over the 50 training
# questions, no validation gate (the final adapter is the last one). GLM 5.3 Flash acts.
# The Evolver's Codex session runs in the framework's sandbox (Linux, bubblewrap), which hides the framework's examples
# and the answers with them, so the run is written outside the checkout.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  test: ../utils/splits/test.txt
  step_size: 10
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  concurrency: 8
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: codex                  # the built-in Codex AgentEvolver
  resume: false                # a fresh session every step
  params:
    model: fireworks/accounts/fireworks/models/glm-5p3   # the learner: GLM 5.3, as for GEPA and SkillOpt
    args: ["-c", 'model_reasoning_effort="medium"', "-c", "model_context_window=1048576"]   # medium effort, as for
                               # GEPA and SkillOpt; the model's context window on Fireworks
    home: []                   # no login files: the provider key is the backend's variable
    tools: [check_spec]        # no run_agent, llm or budget
    hide: []                   # the framework's examples (the answers among them), tests, docs and .git
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: paper-prompt-only
  output_dir: ~/.cache/harnessadapter/officeqa-prompt-only
  tree_dir: ~/.cache/harnessadapter/officeqa-prompt-only/trees/paper-prompt-only   # one adapter tree per run
  epochs: 4
  save_freq: {steps: null, epochs: 1}
  budget: {usd: 40, hours: 30}
  call_timeout_min: 60
eval:
  repeats: 3                 # the target samples: three passes over the test questions
