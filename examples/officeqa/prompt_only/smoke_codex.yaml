# Smoke: the prompt_only Evolver on 4 training questions in 2 steps, 1 epoch; eval on 4 test questions.
# Codex harness: as prompt_only/smoke.yaml, but GLM 5.3 Flash acts in SkillOpt's Codex harness (codex exec in a
# workspace-write sandbox, the skill as SKILL.md, the whole corpus under docs/; utils/agent/agent.py).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  params:
    harness: codex
  concurrency: 4
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: prompt_only
llm:                           # the learner: GLM 5.3 at medium effort, as for GEPA and SkillOpt
  model: fireworks/accounts/fireworks/models/glm-5p3     # <backend>/<model id>; the price is the backend's
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: codex-smoke-prompt-only
  output_dir: runs
  tree_dir: runs/trees/codex-smoke-prompt-only       # one adapter tree per run: runs can train side by side
  epochs: 1
  budget: {usd: null, hours: null}
  call_timeout_min: 30
eval:
  repeats: 3                 # the target samples: three passes over the test questions
