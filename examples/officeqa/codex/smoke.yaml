# Agent smoke: the Codex AgentEvolver with GLM 5.3 Flash; 4 training questions in 2 steps.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
task_info: ../utils/task-info/
model: fireworks/accounts/fireworks/models/glm-5p3-flash   # the run's model: the react agent and the `llm` tool; <backend>/<model id>
agent:
  name: react     # the built-in tool-calling agent: no pipeline code for this task
  concurrency: 4
  params:
    prompt: ../utils/agent/prompt.md
    tools: ../utils/tools.py
    user: "{question}"
    max_turns: 24
    max_tokens: 16384
    max_output_tokens: 65536
    temperature: 0.6
    answer_tag: FINAL_ANSWER
    logs: .logs
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
evolver:
  name: codex_glm
  resume: true
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []                   # an allowlist: the Evolver sees nothing of this machine beyond its workspace and accesses
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: codex-smoke
  output_dir: runs
  epochs: 1
  budget: {usd: 3, hours: 1}
  call_timeout_min: 15
