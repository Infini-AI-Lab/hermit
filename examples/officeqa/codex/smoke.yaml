# Agent smoke: the Codex AgentEvolver with GLM 5.3 Flash (codex_glm/); 4 training questions in 2 steps, 1 epoch;
# eval on 4 test questions. The learner is an agent with a shell, so it must not see examples/ (the answers in
# ../utils/.private/, the other methods' runs and adapters): `hide` covers it, and the run sits outside the checkout.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke_train.txt
  test: ../utils/splits/smoke_test.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info/
model: fireworks/accounts/fireworks/models/glm-5p3-flash   # the run's model: the agent and the `llm` tool; <backend>/<model id>
agent:
  name: ../utils/agent/agent.py:OfficeQAAgent
  concurrency: 4
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: codex_glm
  resume: true
  params:
    hide: []                 # examples/, tests/, docs/ and .git of the framework checkout
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []                   # an allowlist: beyond its workspace and accesses, the Evolver sees the framework read-only
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: codex-smoke
  output_dir: ${HOME}/.cache/harnessadapter/officeqa-codex      # outside the checkout, which `hide` covers
  tree_dir: ${HOME}/.cache/harnessadapter/officeqa-codex/trees/codex-smoke
  epochs: 1
  budget: {usd: 3, hours: 1}
  call_timeout_min: 30
eval:
  repeats: 3                 # the target samples: three passes over the test questions
