# MWM on ServeLearnBench retail_l3: the scenario's serving stream (624 cases in 8 windows), one MWM block per 12
# cases, the benchmark's own agent loop and verifier. Started by `launch.sh retail_l3`, which sets the run's paths.
# The per-window test sets are played afterwards by examples/servelearnbench/windows.py.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/serving.txt      # launch.sh: splits/smoke_serving.txt for a smoke
  test: ../utils/splits/test_w0.txt       # windows.py: test_w<w>.txt per window
  step_size: 12                                              # = prepare.py --block (the benchmark's update cadence)
  shuffle: false                                             # the stream's own order
task_info: ../utils/task-info
agent:
  name: ../utils/agent/agent.py:ServeLearnBenchAgent
  concurrency: 12                                            # the cases of one block, in parallel
judge:
  path: ../utils/judge.py
template: mwm
evolver:
  name: mwm
  params:
    model: fireworks/accounts/fireworks/models/glm-5p3-flash   # launch.sh: the learner's backend through its meter
    args: []                       # launch.sh: reasoning effort high (the provider settings come from the model's backend)
    evidence: null                 # launch.sh: <task workdir>/evidence
    block_size: null               # every block gets a session, the stream's last one included
    learner_tools: []
evolver_access:
  environment: []                  # launch.sh: [<task workdir>/evidence]
  tools: []                        # the venue has no channel: the learner reads /evidence and /environment only
environment:                         # the task sandbox: the agent, MWM's venue texts, the benchmark
  read: [../utils/agent, ../utils/task-info/mwm, ../utils/windows.json]   # windows.json: the task -> window map
                                    # (prepare.py; its ids are the package's own test sets, shown already)
  packages: [servelearnbench]       # its environment and its scoring live in one package
  write: [$SLB_WORKDIR]            # the run's task directory: rows, episodes, evidence
  env: ["SLB_*"]                     # the launcher's settings; SLB_API_KEY is the benchmark's own client's key
                                    # (it calls the model through the launcher's wire meter): a recorded exception
sandbox:
  evolver:
    env: [MW_TOOLSRV]
trainer:
  run_name: null                   # launch.sh: <tag>
  output_dir: runs
  epochs: 1
  call_timeout_min: 130            # first step worst case: bootstrap + its retry + review + its retry, 30 min each
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 72}   # a ceiling only
