# The prompt-only baseline on ServeLearnBench retail_l3: the same stream, cadence, host and scoring as
# ../mwm/retail_l3.yaml, with the prompt-only template (one learned ADAPTER.md, served to the host
# as its context, no tools) and the Codex Evolver of the CL-Bench baseline (one fresh session per step, GLM 5.3 Flash
# through the learner's meter, reasoning effort high, tools gated to check_spec). Started by `launch.sh retail_l3`.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/serving.txt      # launch.sh: splits/smoke_serving.txt for a smoke
  test: ../utils/splits/test_w0.txt       # windows.py: test_w<w>.txt per window
  step_size: 12                                              # = prepare.py --block (the benchmark's update cadence)
  shuffle: false                                             # the stream's own order
task_info: ../utils/task-info
agent:
  name: ../utils/agent/agent.py:ServeLearnBenchAgent
  concurrency: 12                                            # the cases of one block, in parallel
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
evolver:
  name: codex                      # the built-in Codex AgentEvolver, with GLM 5.3 Flash through the learner's meter
  resume: false                    # a fresh session every step
  params:
    args: []                       # launch.sh: reasoning effort high (the provider settings come from the model's backend)
    model: fireworks/accounts/fireworks/models/glm-5p3-flash   # launch.sh: the learner's backend through its meter
    home: []                       # no login files: the provider key is the backend's variable
    tools: [check_spec]            # no run_agent, llm or budget: the MWM learner of this venue has none either
    hide: ["module:servelearnbench"]   # the benchmark's evaluator and test generator live in the installed package
sandbox:
  enabled: true
  network: restricted              # the learner's meter is on the loopback; the allowlist proxy refuses everything else
  allow: []
  read: []
  env: []                          # the learner's model key variable is always passed; nothing else is
  profiles:                        # the agent's sandbox (rollout; eval and check take it too); launch.sh sets it
    rollout: {write: [$SLB_WORKDIR]}                               # the run's task directory: rows, episodes, evidence
trainer:
  run_name: null                   # launch.sh: <tag>
  output_dir: runs
  epochs: 1
  call_timeout_min: 35
  save_freq: {steps: 5, epochs: 1}
  budget: {usd: null, tokens: null, hours: 72}   # a ceiling only
