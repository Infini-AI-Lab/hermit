# OfficeQA in the SkillOpt paper's setting with the GEPA Evolver (the paper's GEPA settings are not published): GEPA's
# default reflection minibatch of 3, Pareto selection over the 24 validation questions, 4 epochs over the 50 training
# questions. GLM 5.3 Flash acts.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt
  val: ../utils/splits/val.txt
  test: ../utils/splits/test.txt
  step_size: 3
  shuffle_seed: 42
task_info: ../utils/task-info/
agent:
  name: ../utils/agent/agent.py:OfficeQAPaperAgent
  concurrency: 8
judge:
  path: ../utils/judge.py
template: prompt-only@1.0
start_from: ../utils/seed_adapter  # SkillOpt's initial OfficeQA skill
evolver:
  name: gepa
llm:                           # the optimizer: GLM 5.3 at medium effort (the paper: GPT-5.5, medium)
  model: fireworks/accounts/fireworks/models/glm-5p3     # <backend>/<model id>; the price is the backend's
  extra_body: {reasoning_effort: medium}
sandbox:
  enabled: true
  network: restricted
  allow: []                  # the Evolver's own model endpoint is always reachable
  read: []
  env: []                    # the Evolver's model key variable is always passed; nothing else is
trainer:
  run_name: paper-gepa
  output_dir: runs
  tree_dir: runs/trees/paper-gepa       # one adapter tree per run: runs can train side by side
  epochs: 4
  budget: {usd: 40, hours: 30}
  call_timeout_min: 60
eval:
  repeats: 3                 # the target samples: three passes over the test questions
