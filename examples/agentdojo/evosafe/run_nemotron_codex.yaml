# Shared Lightning victim and the AgentDyn Codex search budget; frozen AgentDojo comparison-v1.
data:
  tasks: ../utils/data/comparison-v1/tasks.jsonl
  train: ../utils/data/comparison-v1/train.txt
  test: ../utils/data/comparison-v1/test.txt
  step_size: 57
  shuffle: false
task_info: ../utils/task-info
template: evosafe@1.0
agent:
  name: ../utils/task.py:run
  base: direct
  model: vllm/nvidia/nvidia/nemotron-3.5-lightning
  concurrency: 12
  timeout_min: 15
  params:
    episode_timeout_s: 900
    hook_timeout_s: 90
    hook_image: python@sha256:6b25cbe6577518889d553cdd5a5da97d259348d8f6e45b527dd731caaba27a07
    benchmark_version: v1.2.2
    max_iters: 25
    max_tokens: 8192
    temperature: 0.0
    request_timeout_s: 120
    max_retries: 4
    logs: runs/evosafe-lightning-episodes
    auditor:
      enabled: true
      max_calls: 4
      max_chars: 8000
      max_tokens: 2048
      timeout_s: 45
    benchmark: agentdojo
judge:
  path: ../utils/judge.py
evolver:
  name: evosafe
  base: codex
  params:
    min_improvement: 0.07
    validation_tolerance: 0.07
    search_mode: roles
    max_proposals: 3
    gate_mode: source
    cascade_sizes:
    - 12
    - 57
    evaluation_repeats: 1
    eval_task_ids:
    - banking-user_task_11-clean
    - banking-user_task_11-injection_task_2-5ac4dd7d
    - banking-user_task_11-injection_task_3-112b46ac
    - slack-user_task_14-clean
