    mechanism_schedule: []
    reuse_rollout_parent: true
    parent_error_policy: conservative_bounds
    candidate_error_policy: worst_case_bounds
    role_retries: 1
    review_revisions: 2
  codex:
    model: gpt-6-sol
    effort: high
    web_search: false
    timeout_s: 1500
    codex_sandbox: read-only
    args:
    - --disable
    - shell_tool
    - --disable
    - unified_exec
    - --disable
    - multi_agent
    - --disable
    - apps
    - --disable
    - plugins
    - --disable
    - skill_search
    - --disable
    - image_generation
environment:
  runner: host
sandbox:
  evolver:
    allowed_hosts:
    - chatgpt.com
    - auth.openai.com
    - api.openai.com
  enforce: required
trainer:
  run_name: agentdojo-evosafe-lightning-codex-v1
  output_dir: runs
  epochs: 1
  call_timeout_min: 480
  budget:
    hours: 12
  tree_dir: runs/trees/agentdojo-evosafe-lightning-codex-v1
