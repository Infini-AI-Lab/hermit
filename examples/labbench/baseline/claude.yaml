# LAB-Bench FigQA, the baseline: Claude Code with Claude Haiku 5.5 and no adapter, on the 127 test questions of
# SkillOpt's split (the questions the method's adapter is tested on), once each, each question's own 300 s, no web
# search; its 181 questions with --split. Claude Code runs Claude Haiku 5.5 at medium effort on a Claude subscription
# (`claude setup-token`, the token exported as CLAUDE_CODE_OAUTH_TOKEN; no API key), in each task's container.
#
#   hermit eval --config examples/labbench/baseline/claude.yaml --adapter none
#   hermit eval --config examples/labbench/baseline/claude.yaml --adapter none --split examples/labbench/utils/splits/all.txt
#
# The accuracy is the summary's mean_score.
run: {mode: eval}
data:
  tasks: ../utils/tasks.jsonl
  test: ../utils/splits/test.txt       # 127 questions (SkillOpt's split: 2:1:7, seed 42)
agent:
  name: harbor
  concurrency: 8
  params:
    benchmark: ../utils/benchmark.yaml
    acting_agent: {cli: claude}        # Claude Code in the task's container, installed there by Harbor
    model: claude-haiku-5-5            # a Claude Code model name, on the subscription
    login: claude                      # the subscription's plan, shared with Hermit's other sessions on it
    effort: medium
    jobs_dir: ~/.cache/hermit/harbor/jobs/labbench-claude  # the Claude Code configs' trials (and their cache)
judge:
  path: hermit.harbor.judge            # the verifier's reward
trainer:
  run_name: claude-baseline
  output_dir: runs
eval:
  repeats: 1
  infra_retries: 2                     # a trial that is not the agent's result (infra) runs again, twice at most
