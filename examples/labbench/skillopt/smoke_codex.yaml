# Smoke of run_codex.yaml: the same pipeline, Evolver and learner on the two smoke questions (rows <task>#0), two
# epochs of one step, the gate on the same rows, then the final skill's test on them. It checks the task set and its
# patch, the CLI with the figure in the containers and SkillOpt's reflection before the long run.
#
#   hermit train --config examples/labbench/skillopt/smoke_codex.yaml
run: {mode: split}
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt     # the two smoke rows (<task>#0), which no eval or training run takes
  val: ../utils/splits/smoke.txt       # the same rows: the gate's trials of the seed come from the trial cache
  test: ../utils/splits/smoke.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info
agent:
  name: harbor
  concurrency: 2
  params:
    benchmark: ../utils/benchmark.yaml
    acting_agent: {cli: codex}         # Codex in the task's container, installed there by Harbor
    model: gpt-5.6-luna                # a Codex model name, on the ChatGPT login
    login: chatgpt                     # the ChatGPT plan, shared with Hermit's other sessions on it
    effort: medium
    jobs_dir: ~/.cache/hermit/harbor/jobs/labbench-codex-smoke  # the smoke's trials, apart from the run's
judge:
  path: hermit.harbor.judge            # the verifier's reward
template: prompt-only@1.0              # the skill is ADAPTER.md, with no instructions at first (`--adapter root`)
evolver:
  name: skillopt
  params:
    total_steps: 2
    minibatch_size: 2
    merge_batch_size: 2
    analyst_workers: 4
    learning_rate: 4
    min_learning_rate: 2
    lr_scheduler: cosine
    use_gate: true
    gate_metric: hard
    slow_update_samples: 2
    slow_update_gate: true
    use_meta_skill: true
    trajectory_view: paper
    codex_trace_to_optimizer: false
    promote_final: false
    seed: 42
llm:                                   # the learner: the acting model, one Codex session per chat call
  cli: codex
  model: gpt-5.6-luna
  login: chatgpt
  effort: medium
  web_search: false
  isolation: sandbox                   # a bubblewrap sandbox of its own: an empty workspace, the login's hosts
  timeout: 3600
sandbox:
  enabled: true
trainer:
  run_name: smoke-codex-skillopt
  output_dir: runs
  tree_dir: runs/trees/smoke-codex-skillopt
  epochs: 2
  save_freq: {steps: 1}
  call_timeout_min: 600
  budget: {usd: null, tokens: null, hours: null}
eval:
  repeats: 1
