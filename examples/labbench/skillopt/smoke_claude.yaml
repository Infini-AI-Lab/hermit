# Smoke of run_claude.yaml: the same pipeline, Evolver and learner on the two smoke questions (rows <task>#0), two
# epochs of one step, the gate on the same rows; `--adapter final` then tests the final skill on them. It checks the
# task set and its patch, the CLI with the figure in the containers and SkillOpt's reflection before the long run.
#
#   hermit train --config examples/labbench/skillopt/smoke_claude.yaml
#   hermit eval  --config examples/labbench/skillopt/smoke_claude.yaml --adapter final
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt     # the two smoke rows (<task>#0), which no eval or training run takes
  val: ../utils/splits/smoke.txt       # the same rows: the gate runs its own trials of them (run_agent's)
  test: ../utils/splits/smoke.txt
  step_size: 2
  shuffle_seed: 42
task_info: ../utils/task-info
agent:
  base: claude                         # Claude Code in each task's own Harbor environment, installed there by Harbor
  concurrency: 2
  model: {name: claude-haiku-5-5, login: claude, effort: medium}  # the subscription's plan, shared
  claude: {web_search: false}           # the CLI's web search off
environment:
  harbor:                            # each task in its own Harbor environment, verified by Harbor's verifier
    benchmark: ../utils/benchmark.yaml  # the settings every config of this example shares
    jobs_dir: ~/.cache/hermit/harbor/jobs/labbench-claude-smoke  # the smoke's environments, apart from the run's
judge:
  path: hermit.task.verify            # Harbor's verifier, in the task's environment: the verifier's reward
  name: environment
template: prompt-only@1.0              # the skill is ADAPTER.md, with no instructions at first (`--adapter root`)
evolver:
  name: skillopt
  params:
    total_steps: 2
    minibatch_size: 2
    merge_batch_size: 2
    analyst_workers: 4
    learning_rate: 4
    min_learning_rate: 2
    lr_scheduler: cosine
    use_gate: true
    gate_metric: hard
    slow_update_samples: 2
    slow_update_gate: true
    use_meta_skill: true
    trajectory_view: paper
    codex_trace_to_optimizer: false
    promote_final: false
    seed: 42
llm:                                   # the learner: the acting model, one Claude Code session per chat call
  cli: claude
  model: claude-haiku-5-5
  login: claude
  effort: medium
  web_search: false
  isolation: sandbox                   # a bubblewrap sandbox of its own: an empty workspace, the login's host
  timeout: 3600
  plan_max_wait_s: null                # a call waits for the plan's window however long it holds
sandbox:
  enabled: true
trainer:
  run_name: smoke-claude-skillopt
  output_dir: runs
  tree_dir: runs/trees/smoke-claude-skillopt
  epochs: 2
  save_freq: {steps: 1}
  call_timeout_min: 600
  budget: {usd: null, tokens: null, hours: null}
eval:
  repeats: 1
