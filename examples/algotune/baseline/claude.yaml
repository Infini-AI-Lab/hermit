# AlgoTune, the baseline: Claude Code with Claude Haiku 5.5 and no adapter, on the 108 test tasks of SkillOpt's split
# (the tasks the method's adapter is tested on), once each, each task's own hour, no web search; its 154 tasks with
# `data.test=../utils/splits/all.txt` (below). Claude Code runs Claude Haiku 5.5 at medium effort on a Claude
# subscription (`claude setup-token`, the token exported as CLAUDE_CODE_OAUTH_TOKEN; no API key), in each task's
# container.
#
#   hermit eval --config examples/algotune/baseline/claude.yaml --adapter none
#   hermit eval --config examples/algotune/baseline/claude.yaml --adapter none \
#       data.test=../utils/splits/all.txt trainer.run_name=claude-baseline-all
#
# AlgoTune's score is the harmonic mean of the speedups, 1 / (1 - m) for the mean m of the scores of the trials that are
# the agent's result, which `python examples/algotune/utils/judge.py <eval dir>` prints (the summary's mean_score counts
# an infra trial as 0, as no speedup).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt     # placeholder, as template and evolver are: hermit eval reads it, trains nothing
  test: ../utils/splits/test.txt       # 108 tasks (SkillOpt's split: 2:1:7, seed 42)
agent:
  name: harbor
  concurrency: 6
  params:
    benchmark: ../utils/benchmark.yaml
    acting_agent: {cli: claude}        # Claude Code in the task's container, installed there by Harbor
    model: claude-haiku-5-5            # a Claude Code model name, on the subscription
    login: claude                      # the subscription's plan, shared with Hermit's other sessions on it
    effort: medium
    jobs_dir: ~/.cache/hermit/harbor/jobs/algotune-claude  # the Claude Code configs' trials
judge:
  path: ../utils/judge.py              # 1 - 1/speedup (utils/judge.py)
template: prompt-only@1.0              # placeholder (see data.train)
task_info: ../utils/task-info          # what hermit check asks of a training config
evolver: {name: eval-only}             # placeholder: no Evolver of this name, so hermit train refuses this config
trainer:
  run_name: claude-baseline
  output_dir: runs
eval:
  repeats: 1
