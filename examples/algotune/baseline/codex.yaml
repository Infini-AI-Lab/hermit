# AlgoTune, the baseline: Codex with GPT-5.6-Luna and no adapter, on the 108 test tasks of SkillOpt's split (the tasks
# the method's adapter is tested on), once each, each task's own hour, no web search; its 154 tasks with
# `data.test=../utils/splits/all.txt` (below). Codex runs GPT-5.6-Luna at medium effort on the ChatGPT login
# (`codex login`, no API key), in each task's container.
#
#   hermit eval --config examples/algotune/baseline/codex.yaml --adapter none
#   hermit eval --config examples/algotune/baseline/codex.yaml --adapter none \
#       data.test=../utils/splits/all.txt trainer.run_name=codex-baseline-all
#
# AlgoTune's score is the harmonic mean of the speedups, 1 / (1 - m) for the mean m of the scores of the trials that are
# the agent's result, which `python examples/algotune/utils/judge.py <eval dir>` prints (the summary's mean_score counts
# an infra trial as 0, as no speedup).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt     # placeholder, as template and evolver are: hermit eval reads it, trains nothing
  test: ../utils/splits/test.txt       # 108 tasks (SkillOpt's split: 2:1:7, seed 42)
agent:
  name: harbor
  concurrency: 6
  params:
    benchmark: ../utils/benchmark.yaml
    acting_agent: {cli: codex}         # Codex in the task's container, installed there by Harbor
    model: gpt-5.6-luna                # a Codex model name, on the ChatGPT login
    login: chatgpt                     # the ChatGPT plan, shared with Hermit's other sessions on it
    effort: medium
    jobs_dir: ~/.cache/hermit/harbor/jobs/algotune-codex  # the Codex configs' trials
judge:
  path: ../utils/judge.py              # 1 - 1/speedup (utils/judge.py)
template: prompt-only@1.0              # placeholder (see data.train)
task_info: ../utils/task-info          # what hermit check asks of a training config
evolver: {name: eval-only}             # placeholder: no Evolver of this name, so hermit train refuses this config
trainer:
  run_name: codex-baseline
  output_dir: runs
eval:
  repeats: 1
