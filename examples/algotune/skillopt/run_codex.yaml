# AlgoTune with SkillOpt, in the SkillOpt paper's protocol (Yang et al., arXiv:2605.23904v2, §4: its Codex and Claude
# Code harness rows, SpreadsheetBench's code generation the nearest task): the tasks split 2:1:7 with its seed 42 (31
# train, 15 validation, 108 test), 4 epochs, every training task each epoch (its rollout batch 40), reflection
# minibatches of 8, at most 4 edits a step decaying to 2 (cosine), a candidate kept only if it beats the current skill
# on validation, from the second epoch the slow update and the meta skill at the epoch's end, the best skill handed
# back.
# Codex runs GPT-5.6-Luna at medium effort on the ChatGPT login (`codex login`, no API key), as the acting agent in
# each task's container and as the learner (the paper: GPT-5.5 at medium effort, both). What differs from the paper
# besides the model: the gate compares the validation tasks' mean score, 1 - 1/speedup (AlgoTune's harmonic mean), as
# SkillOpt's soft metric, a speedup having no pass or fail; a success, by which SkillOpt's analysts and slow update
# sort the rollouts, is a solver faster than the reference; the analysts get no Codex trace summary (SkillOpt's
# describes its own harness); the skill is ADAPTER.md of the prompt-only template, which starts with no instructions.
#
#   hermit train --config examples/algotune/skillopt/run_codex.yaml   # again to resume
#   hermit eval  --config examples/algotune/skillopt/run_codex.yaml --adapter final
#   hermit eval  --config examples/algotune/skillopt/run_codex.yaml --adapter root
#
# After the 4 epochs, `--adapter final` tests the final skill on the 108 test tasks; ../baseline/codex.yaml tests no
# adapter on them, and `--adapter root` the empty skill; both after `hermit train`, adapters of its tree.
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/train.txt     # 31 tasks
  val: ../utils/splits/val.txt         # 15 tasks: the gate
  test: ../utils/splits/test.txt       # 108 tasks
  step_size: 40                        # the paper's rollout batch: every training task, one step an epoch
  shuffle_seed: 42
task_info: ../utils/task-info
agent:
  base: codex                          # Codex in each task's own Harbor environment, installed there by Harbor
  concurrency: 6
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}  # the ChatGPT plan, shared
  codex: {web_search: false}           # the CLI's web search off
environment:
  harbor:                            # each task in its own Harbor environment, verified by Harbor's verifier
    benchmark: ../utils/benchmark.yaml  # the settings every config of this example shares
    jobs_dir: ~/.cache/hermit/harbor/jobs/algotune-codex  # the Codex configs' environments (each task's trial)
judge:
  path: ../utils/judge.py              # 1 - 1/speedup (utils/judge.py)
template: prompt-only@1.0              # the skill is ADAPTER.md, with no instructions at first (`--adapter root`)
evolver:
  name: skillopt
  params:
    total_steps: 4                     # 4 epochs of one step: the learning rate's cosine from 4 to 2
    minibatch_size: 8                  # the paper's reflection minibatch
    merge_batch_size: 8
    analyst_workers: 16
    learning_rate: 4
    min_learning_rate: 2
    lr_scheduler: cosine
    use_gate: true                     # strict: a candidate must beat the current skill on validation
    gate_metric: soft                  # the mean of 1 - 1/speedup
    success_score: 0.000001            # a success, for SkillOpt's analysts and slow update: a solver faster
                                       # than the reference (a score above 0, the verifier's own test)
    slow_update_samples: 20            # from epoch 2, at its end: the last two epochs' skills on 20 training tasks
    slow_update_gate: true             # and the slow update passes the validation gate too, as in the paper
    use_meta_skill: true               # from epoch 2 too: guidance for the learner only, never deployed, not gated
    trajectory_view: paper             # the trajectories as the paper's analyst saw them
    codex_trace_to_optimizer: false    # SkillOpt's Codex trace summary reads its own harness (task.md, SKILL.md,
                                       # <answer>), not a Harbor task: off for both CLIs
    promote_final: false               # the paper's code hands back the best skill as it is
    seed: 42
llm:                                   # the learner: the acting model, one Codex session per chat call
  cli: codex
  model: gpt-5.6-luna
  login: chatgpt
  effort: medium
  web_search: false
  isolation: sandbox                   # a bubblewrap sandbox of its own: an empty workspace, the login's hosts
  timeout: 3600
  plan_max_wait_s: null                # a call waits for the plan's window however long it holds
sandbox:
  enabled: true
trainer:
  run_name: codex-skillopt
  output_dir: runs
  tree_dir: runs/trees/codex-skillopt  # one adapter tree per run: runs can train side by side
  epochs: 4                            # the paper's 4 epochs
  save_freq: {steps: 1}
  call_timeout_min: 10080              # a week: a step's reflection and gate, and a wait for the plan's window
  budget: {usd: null, tokens: null, hours: null}
eval:
  repeats: 1
