# smoke.yaml with the models changed and nothing else: GPT-5.6-Luna at medium effort acts and coordinates on the
# machine's own ChatGPT login (`codex login`; no API key). Started by launch.sh: ASPIRE_CONFIG=smoke_luna.yaml
# ./launch.sh (its seeds are the smoke's).
data:
  tasks: ../utils/tasks.jsonl
  train: ../utils/splits/smoke.txt
  val: ../utils/splits/verify.txt   # the verifier's rows: run only by the coordinator, through run_agent
  test: ../utils/splits/smoke_rerun.txt
  step_size: 1
  shuffle: false
task_info: ../utils/task-info
agent:
  base: codex
  concurrency: 1
  params:
    prompt: ../../aspire_robosuite/utils/agent/task.py:prompt
    prepare: ../../aspire_robosuite/utils/agent/task.py:prepare
    answer: ../../aspire_robosuite/utils/agent/task.py:answer
    collect: ../../aspire_robosuite/utils/agent/task.py:collect
    aspire_root: $ASPIRE_ROOT
    aspire_docs: $ASPIRE_DOCS
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}
  codex:
    web_search: false
    timeout_s: 5400
    codex_sandbox: danger-full-access   # the task sandbox is the boundary; the session reaches bin/sim's service
    shell_env: all                  # only the declared variables are in the sandbox
    project_doc_max_bytes: 131072   # AGENTS.md carries the whole library (the template caps it at 100,000 bytes)
environment:                        # the task sandbox: the actor's code, ASPIRE's prompts and docs, nothing else of it
  read:
    - ../../aspire_robosuite/utils/agent   # the engine's task functions, bin/sim's client, the prompt pages
    - $ASPIRE_DOCS                    # ASPIRE's docs as staged by launch.sh: nothing that names its worked programs
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/subagent-prompt.md
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/verifier-prompt.md
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/scripts/scene_snapshot.py
    - $ASPIRE_ROOT/.claude/skills/iterative-debugging/skills/task-exploration.md
    - $ASPIRE_ROOT/.claude/skills/evosearch/subagent-prompt.md
    - $ASPIRE_ROOT/.claude/skills/evosearch/skills/evosearch-iteration.md
  env: [ASPIRE_SIM_URL]             # the host's simulator service (launch.sh): its 127.0.0.1 port is forwarded
judge:
  path: ../../aspire_robosuite/utils/judge.py           # on the host: Stage 2 on the held-out seeds
template: aspire
evolver:
  name: aspire
  base: codex
  model: {name: gpt-5.6-luna, login: chatgpt, effort: medium}
  codex: {web_search: false}
sandbox:
  enabled: true
  enforce: required
trainer:
  run_name: smoke-aspire-libero-luna
  epochs: 1
  call_timeout_min: 240
  budget: {usd: null, hours: 8}      # the login's plan has no price
eval:
  repeats: 1
