# LiveMathBench, the baseline: Claude Code with Claude Haiku 5.5 and no adapter, on the 202505 release's English questions,
# four times each, an hour each, no web search. Claude Code runs Claude Haiku 5.5 at medium effort on a Claude subscription (`claude setup-token`, the token exported as
# CLAUDE_CODE_OAUTH_TOKEN; no API key).
# The judge is a model too: LIVEMATHBENCH_JUDGE, a `<backend>/<model>` reference (default
# vllm/Qwen/Qwen2.5-72B-Instruct, the paper's, on a local vLLM server); see ../README.md.
#
#   hermit eval --config examples/livemathbench/baseline/claude.yaml --adapter none
#
# The accuracy is the summary's mean_score (runs/claude-baseline/eval/none/ beside this file); utils/gpassk.py gives
# G-Pass@k from the same eval.
data:
  tasks: ../utils/benchmark/tasks
  train: ../utils/benchmark/splits/smoke.txt   # placeholder, as template and evolver are: hermit eval trains nothing
  test: ../utils/benchmark/splits/test.txt   # the 202505 release's English questions
agent:
  base: claude                     # Claude Code in each problem's own sandbox (Hermit's bubblewrap, no network but its model's)
  concurrency: 8
  params:
    answer: ../utils/agent/answer.py:answer   # OpenCompass's math_postprocess_v2 of its final message
  model: {name: claude-haiku-5-5, login: claude, effort: medium}  # the plan, shared
  claude: {web_search: false, timeout_s: 3600}  # the CLI's web search off; the task's own time
environment:
  read: [../utils/agent]                   # the answer hook (answer.py:answer), which runs in the task sandbox
judge:
  path: ../utils/benchmark/judge.py    # on the host: OpenCompass's judge model (LIVEMATHBENCH_JUDGE) on the reference
template: prompt-only@1.0              # placeholder (see data.train)
task_info: ../utils/benchmark/task-info  # what hermit check asks of a training config
evolver: {name: eval-only}             # placeholder: no Evolver of this name, so hermit train refuses this config
trainer:
  run_name: claude-baseline
  output_dir: runs
eval:
  repeats: 4                           # each test question four times: the mean accuracy; utils/gpassk.py: G-Pass@k
