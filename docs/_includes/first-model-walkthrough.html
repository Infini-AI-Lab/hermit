nsolas,monospace}.ha-anim-svg .b{font-weight:700}.ha-anim-svg .m5{font-weight:500}.ha-anim-svg .it{font-style:italic}.ha-anim-svg .halo{paint-order:stroke;stroke:var(--map-bg);stroke-width:5px;stroke-linejoin:round}.ha-anim-svg .f-bg{fill:var(--map-bg)}.ha-anim-svg .f-blue{fill:var(--map-blue)}.ha-anim-svg .f-amber{fill:var(--map-amber)}.ha-anim-svg .f-purple{fill:var(--map-purple)}.ha-anim-svg .f-bs{fill:var(--map-blue-surface)}.ha-anim-svg .f-as{fill:var(--map-amber-surface)}.ha-anim-svg .f-ps{fill:var(--map-purple-surface)}.ha-anim-svg .f-ns{fill:var(--map-neutral-surface)}.ha-anim-svg .s-line{stroke:var(--map-line)}.ha-anim-svg .s-bb{stroke:var(--map-blue-border)}.ha-anim-svg .s-ab{stroke:var(--map-amber-border)}.ha-anim-svg .s-pb{stroke:var(--map-purple-border)}.ha-anim-svg .s-blue{stroke:var(--map-blue)}.ha-anim-svg .s-amber{stroke:var(--map-amber)}.ha-anim-svg .s-purple{stroke:var(--map-purple)}.ha-anim-svg .fs12{font-size:12px}.ha-anim-svg .fs13{font-size:13px}.ha-anim-svg .fs14{font-size:14px}.ha-anim-svg .fs15{font-size:15px}.ha-anim-svg .fs16{font-size:16px}.ha-anim-svg .fs18{font-size:18px}.ha-anim-svg .fs20{font-size:20px}.ha-anim-svg .fs21{font-size:21px}</style><defs>

<text x="43.5" y="61" text-anchor="start" class="fs21 b">Training/Evolution Loop</text>
<text x="43.5" y="88" text-anchor="start" class="fs15 mu">first-model walkthrough · example scores</text>
<rect x="350.75" y="34.75" width="610.5" height="136.5" rx="10" class="f-bg s-line" stroke-width="1.5"/>
<g opacity="1"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1020"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">1</tspan><tspan dx="9" class="mono b">hermit check</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">Runs the first training task with no adapter, and sends one short request</text><text x="366" y="107" text-anchor="start" class="fs15">to the learner model. Both only test the connections.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+1 acting</tspan><tspan dx="14" class="f-purple">+1 learner</tspan></text><text x="366" y="158" text-anchor="start" class="fs14 mu it">The command before it, check --no-probe, only loads components: no requests.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1020;0.1939"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">2</tspan><tspan dx="9" class="mono b">hermit eval --adapter none</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">Runs the 3 test tasks with no adapter. This is the baseline score.</text><text x="366" y="107" text-anchor="start" class="fs15">Evaluation only measures: nothing goes to the learning side.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1939;0.2857"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· rollouts</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">The acting agent runs the 3 training tasks with root, the starting adapter.</text><text x="366" y="107" text-anchor="start" class="fs15">The answers and the judge's feedback become learning material for GEPA.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2857;0.3776"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· GEPA scores root</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">GEPA has the acting agent run root on the 3 validation tasks.</text><text x="366" y="107" text-anchor="start" class="fs15">It keeps only the scores: root becomes candidate #0 in its pool.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text><text x="366" y="158" text-anchor="start" class="fs14 mu it">The learner model never sees the validation tasks.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3776;0.4592"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· reflection</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">A training answer was wrong, so GEPA sends the attempts and the judge's</text><text x="366" y="107" text-anchor="start" class="fs15">feedback to the learner model, which writes a new ADAPTER.md.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-purple">+1 learner</tspan><tspan dx="14" class="mu">(one more if the reply holds no usable instructions)</tspan></text><text x="366" y="158" text-anchor="start" class="fs14 mu it">If all 3 training answers had been right: nothing to learn, 16 requests in total.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4592;0.5612"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· test the new version</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">It passes the specification check, then reruns the same 3 training tasks.</text><text x="366" y="107" text-anchor="start" class="fs15">Example: 3/3 beats root's 2/3, so GEPA keeps it.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text><text x="366" y="158" text-anchor="start" class="fs14 mu it">Not higher than root? GEPA discards it: 19 requests in total.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5612;0.6531"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· score it on validation</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">The kept version runs the 3 validation tasks (example: 3/3)</text><text x="366" y="107" text-anchor="start" class="fs15">and joins the pool as candidate #1.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6531;0.7347"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">3</tspan><tspan dx="9" class="mono b">hermit train</tspan><tspan dx="9" class="mu">· hand back and record</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">GEPA hands back its pick; the Trainer checks it and records the version.</text><text x="366" y="107" text-anchor="start" class="fs15">final = the candidate with the best validation score: #1 here, else root.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="mu">no model requests</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7347;0.8163"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">4</tspan><tspan dx="9" class="mono b">hermit eval --adapter root</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">Runs the 3 test tasks with root. Training never used these tasks.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8163;0.8980"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">5</tspan><tspan dx="9" class="mono b">hermit eval --adapter final</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">Runs the same 3 test tasks with final, to compare with root's score.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="f-blue">+3 acting</tspan></text></g>
<g opacity="0"><animate attributeName="opacity" dur="49.00s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8980"/><text x="366" y="60" text-anchor="start" class="fs16"><tspan class="b">Total: 22 acting + 2 learner requests</tspan></text><text x="366" y="86" text-anchor="start" class="fs15">This run tested and kept a new version, which gives the maximum.</text><text x="366" y="107" text-anchor="start" class="fs15">16 if no new version is tested · 19 if it is tested but not kept.</text><text x="366" y="133" text-anchor="start" class="fs15 b"><tspan class="mu">Learner: 1 to 3 (one more if a reply holds no usable instructions)</tspan></text></g>
