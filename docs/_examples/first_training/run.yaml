data:
  tasks: tasks.jsonl
  train: train.txt
  test: test.txt
  step_size: 1
  shuffle: false
task_info: task-info
judge:
  path: judge.py
template: prompt-only@1.0
evolver:
  name: learner
sandbox:
  enforce: best_effort          # bubblewrap where it is installed; elsewhere unconfined, recorded and warned
environment:
  read: [pipeline.py]           # the agent's code; the data, the judge and the runs stay outside
trainer:
  run_name: first-training
  output_dir: ../../../.demo/first-training
  epochs: 1
  budget:
    tokens: 1000
    hours: 0.02
  call_timeout_min: 1
agent:
  concurrency: 1
  name: pipeline.py:run
