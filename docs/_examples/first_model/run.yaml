data:
  tasks: tasks.jsonl
  train: train.txt
  val: val.txt
  test: test.txt
  step_size: 3
  shuffle: false
task_info: task-info
judge:
  path: judge.py
template: prompt-only@1.0
evolver:
  name: gepa
  params:
    max_tokens: 4096
llm:
  base_url: https://your-endpoint.example/v1
  model: your-model-id
  api_key_env: MODEL_API_KEY
sandbox:
  enabled: false
  network: none
  env: []
trainer:
  run_name: first-model
  output_dir: runs
  epochs: 1
  budget:
    tokens: 30000
    hours: 0.25
  call_timeout_min: 5
agent:
  concurrency: 1
  name: pipeline.py:run
