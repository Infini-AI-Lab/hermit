<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Harness adapter · Draft</title>
<style>
@font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/space-grotesk-400.ttf') format('truetype'); }
@font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/space-grotesk-500.ttf') format('truetype'); }
@font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/space-grotesk-600.ttf') format('truetype'); }
</style>
<style>
:root {
  color-scheme: light;
  --paper: #fbfaf7; --ink: #2d2a26; --quiet: #777873;
  --line: #d8d7d1; --outline: #2e3f66; --core: #e3e7f0;
  --ice: #2e5bd9; --adapter: #4a2e13; --adapter-fill: #efe2ce; --adapter-ink: #3a2510;
  --scenario-fill: #eceae4; --scenario-line: #3a342b;
  --pass: #1f9367; --fail: #b85540; --training: #d8731e; --flow: #2C4A6B;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --paper: #191e23; --ink: #e6e7e3; --quiet: #a2aaa9; --line: #3e474e; --outline: #9daec9; --core: #293241; --ice: #a3c0df; --adapter: #c5a374; --adapter-fill: #453b2d; --adapter-ink: #edd8b8; --scenario-fill: #2d302f; --scenario-line: #a6aaa0; --pass: #9bceb3; --fail: #dba99b; --training: #efb078; --flow: #9daec9; } }
:root[data-theme="dark"] { color-scheme: dark; --paper: #191e23; --ink: #e6e7e3; --quiet: #a2aaa9; --line: #3e474e; --outline: #9daec9; --core: #293241; --ice: #a3c0df; --adapter: #c5a374; --adapter-fill: #453b2d; --adapter-ink: #edd8b8; --scenario-fill: #2d302f; --scenario-line: #a6aaa0; --pass: #9bceb3; --fail: #dba99b; --training: #efb078; --flow: #9daec9; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
main { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding-block: 28px 24px; }
h1 { font-size: 15px; font-weight: 500; color: var(--quiet); margin: 0; letter-spacing: .2px; }
.variant { padding: 0; }
.variant h2 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.variant p.note { font-size: 13px; color: var(--quiet); margin: 0 0 14px; }
figure { margin: 0; }
svg.scene { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--ink); font-family: inherit; }
.base-core { color: var(--outline); }
.core-box { fill: var(--core); stroke: var(--outline); stroke-width: 3; }
.entity-label { font-size: 22px; font-weight: 500; letter-spacing: .3px; }
.base-core .entity-label { fill: var(--outline); }
.scenario-label { font-size: 22px; }
.frozen-badge { color: var(--ice); }
.frozen-badge text { fill: var(--ice); font-size: 17px; font-weight: 500; }
.core-components text { fill: var(--outline); font-size: 16px; font-weight: 500; }
.core-components .group-bracket { font-size: 21px; font-weight: 400; }
.socket { fill: var(--paper); stroke: var(--outline); stroke-width: 2; }
.adapter { color: var(--adapter-ink); }
.adapter-box { fill: var(--adapter-fill); stroke: var(--adapter); stroke-width: 3; }
.adapter-label { fill: var(--adapter-ink); font-size: 18px; font-weight: 500; letter-spacing: .3px; }
.port { fill: var(--paper); stroke: var(--outline); stroke-width: 2; }
.port.lit { stroke: var(--adapter); }
.seam { fill: none; stroke: var(--adapter); stroke-width: 3; stroke-linecap: round; }
.rail { fill: none; stroke: var(--outline); stroke-width: 2; stroke-linecap: round; }
.link { fill: none; stroke: var(--adapter); stroke-width: 3; stroke-linecap: round; }
.signal { fill: var(--training); }
.pin { stroke: var(--adapter); stroke-width: 3.5; stroke-linecap: round; fill: none; }
.cord { stroke: var(--adapter); stroke-width: 3; stroke-linecap: round; fill: none; }
.hole { fill: var(--outline); }
.contact { fill: var(--training); }
.slotblock { fill: var(--outline); }
.flash { fill: none; stroke: var(--training); stroke-width: 2.5; }
.whole { fill: none; stroke: var(--outline); stroke-width: 2; stroke-dasharray: 7 5; }
.whole-label { fill: var(--outline); font-size: 13px; font-weight: 500; letter-spacing: .6px; }
.adapter-version { fill: var(--adapter-ink); font-size: 15px; font-weight: 600; }
.version-tag { fill: var(--paper); stroke: var(--adapter); stroke-width: 1.25; }
.scenario { color: var(--scenario-line); }
.scenario-box { fill: var(--scenario-fill); stroke: var(--fail); stroke-width: 3; }
.fit-label { font-size: 22px; font-weight: 500; }
.limited { fill: var(--fail); }
.better { fill: var(--pass); }
.feedback { color: var(--training); }
.feedback-line, .feedback-head { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.feedback-label { fill: currentColor; font-size: 13px; font-weight: 500; }
.flow path { stroke: var(--flow); }
.score-axis { fill: none; stroke: var(--quiet); stroke-width: 1; }
.score-axis-label { fill: var(--quiet); font-size: 10px; letter-spacing: .6px; }
.score-line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.subtitles { display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 72px; padding: 8px 12px 0; }
.subtitle-line { font-size: clamp(13px, 1.85vw, 16px); line-height: 1.35; font-weight: 500; margin: 1px 0; opacity: 0; }
.controls { display: flex; align-items: center; gap: 10px; max-width: 460px; margin: 4px auto 0; color: var(--quiet); }
button { font: inherit; font-size: 12px; color: inherit; border: 0; background: transparent; padding: 8px; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border-radius: 5px; cursor: pointer; }
button:hover { background: var(--core); color: var(--ink); }
button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#play-icon { fill: currentColor; stroke: none; }
#timeline { -webkit-appearance: none; appearance: none; background: transparent; min-width: 0; flex: 1; height: 24px; cursor: pointer; }
#timeline::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--outline) var(--progress, 0%), var(--line) var(--progress, 0%)); }
#timeline::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; margin-top: -3.5px; border-radius: 50%; background: var(--outline); }
#timeline::-moz-range-track { height: 3px; background: var(--line); }
#timeline::-moz-range-progress { height: 3px; background: var(--outline); }
#timeline::-moz-range-thumb { width: 10px; height: 10px; border: 0; border-radius: 50%; background: var(--outline); }
output { font-size: 11px; font-variant-numeric: tabular-nums; min-width: 64px; }
</style>
</head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="brain" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M9 13a4.5 4.5 0 0 0 3-4"/><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/><path d="M3.477 10.896a4 4 0 0 1 .585-.396"/><path d="M6 18a4 4 0 0 1-1.967-.516"/><path d="M12 13h4"/><path d="M12 18h6a2 2 0 0 1 2 2v1"/><path d="M12 8h8"/><path d="M16 8V5a2 2 0 0 1 2-2"/><circle cx="16" cy="13" r=".5"/><circle cx="18" cy="3" r=".5"/><circle cx="20" cy="21" r=".5"/><circle cx="20" cy="8" r=".5"/></g></symbol>
<symbol id="harness" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 13.5L9.682 10.318" stroke-linecap="butt"/><polygon points="12.722,7.278 11.096,11.874 8.126,8.904" fill="currentColor" stroke="none"/><path d="M6.5 18.5L9.682 21.682" stroke-linecap="butt"/><polygon points="12.722,24.722 8.126,23.096 11.096,20.126" fill="currentColor" stroke="none"/><path d="M18.5 6.5L21.682 9.682" stroke-linecap="butt"/><polygon points="24.722,12.722 20.126,11.096 23.096,8.126" fill="currentColor" stroke="none"/><path d="M18.5 25.5L21.682 22.318" stroke-linecap="butt"/><polygon points="24.722,19.278 23.096,23.874 20.126,20.904" fill="currentColor" stroke="none"/><rect x="1.5" y="13.5" width="5" height="5" rx="1.6"/><rect x="13.5" y="1.5" width="5" height="5" rx="1.6"/><rect x="25.5" y="13.5" width="5" height="5" rx="1.6"/><rect x="13.5" y="25.5" width="5" height="5" rx="1.6"/></g></symbol>
<symbol id="flask" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/></g></symbol>
<symbol id="snowflake" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M3.34 7l17.32 10M3.34 17 20.66 7M9 4l3 3 3-3M9 20l3-3 3 3M3.6 10.5l4.1-1.1-1.1-4.1M20.4 13.5l-4.1 1.1 1.1 4.1M6.6 18.7l1.1-4.1-4.1-1.1M17.4 5.3l-1.1 4.1 4.1 1.1"/></g></symbol>
<symbol id="adapter-icon" viewBox="0 0 256 256"><g fill="currentColor"><path d="M237.66,18.34a8,8,0,0,0-11.32,0l-52.4,52.41-5.37-5.38a32.05,32.05,0,0,0-45.26,0L100,88.69l-6.34-6.35A8,8,0,0,0,82.34,93.66L88.69,100,65.37,123.31a32,32,0,0,0,0,45.26l5.38,5.37-52.41,52.4a8,8,0,0,0,11.32,11.32l52.4-52.41,5.37,5.38a32,32,0,0,0,45.26,0L156,167.31l6.34,6.35a8,8,0,0,0,11.32-11.32L167.31,156l23.32-23.31a32,32,0,0,0,0-45.26l-5.38-5.37,52.41-52.4A8,8,0,0,0,237.66,18.34Zm-116.29,161a16,16,0,0,1-22.62,0L76.69,157.25a16,16,0,0,1,0-22.62L100,111.31,144.69,156Zm57.94-57.94L156,144.69,111.31,100l23.32-23.31a16,16,0,0,1,22.62,0l22.06,22A16,16,0,0,1,179.31,121.37ZM88.57,35A8,8,0,0,1,103.43,29l8,20A8,8,0,0,1,96.57,55ZM24.57,93A8,8,0,0,1,35,88.57l20,8A8,8,0,0,1,49,111.43l-20-8A8,8,0,0,1,24.57,93ZM231.43,163a8,8,0,0,1-10.4,4.46l-20-8A8,8,0,1,1,207,144.57l20,8A8,8,0,0,1,231.43,163Zm-64,58.06A8,8,0,0,1,152.57,227l-8-20A8,8,0,0,1,159.43,201Z"/></g></symbol>
</defs></svg>
<main>
<section class="variant" id="v-label"><figure aria-label="A harness adapter plugs into a frozen agent's side; framed together they are the agent that meets the scenario, and feedback trains the adapter."></figure></section>
<div class="controls" aria-label="Animation controls">
<button id="play-pause" type="button" aria-label="Pause animation"><svg id="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg><svg id="play-icon" viewBox="0 0 20 20" aria-hidden="true" hidden><path d="m7 4 9 6-9 6Z"/></svg></button>
<button id="replay" type="button" aria-label="Replay animation"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6.5 6.5 0 1 1 .8 6.3M4 3v5h5"/></svg><span>Replay</span></button>
<input id="timeline" type="range" min="0" max="9" value="0" step="0.01" aria-label="Animation position in seconds">
<output id="time" for="timeline">0.0 / 9s</output>
</div>
<p class="draft-note">Concept draft · V0 → V5 · trained from feedback</p>
</main>
<script>
(() => {
  'use strict';
  const duration = 9;
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => { const t = clamp(x); return t * t * (3 - 2 * t); };
  const fade = (time, at, length = .45) => ease((time - at) / length);
  const alpha = (el, v) => el.setAttribute('opacity', v.toFixed(3));

  // Agent box 40..350 × 24..140; the adapter plugs into its right edge; a dashed frame 28..638 × 12..152 closes
  // around both; the scenario sits at 706..930 as before.
  const AX = 40, AY = 24, AW = 310, AH = 116, CY = 82, R = AX + AW;      // R = 350, the agent's right edge
  const BX = 374, BW = 250, BY = 56, BH = 52;                              // the adapter box
  const FX = 28, FY = 12, FW = 638 - 28, FH = 140;                         // the frame
  const heading = (p, cx, base) => `<g data-center-x="${cx}"><text class="entity-label" x="0" y="${base}">Agent</text><g class="core-components"><text class="group-bracket" x="70" y="${base}">(</text><use href="#brain" x="82" y="${base - 19}" width="22" height="22"/><text x="110" y="${base}">Model</text><use href="#harness" x="166" y="${base - 19}" width="22" height="22"/><text x="194" y="${base}">Harness</text><text class="group-bracket" x="265" y="${base}">)</text></g></g>`;
  const frozen = p => `<g id="${p}-frozen" class="frozen-badge" opacity="0"><use href="#snowflake" x="${AX + 16}" y="${AY + 4}" width="18" height="18"/><text x="${AX + 42}" y="${AY + 18}">Frozen</text></g>`;
  const adapterInner = (p, x, y, w) => `<use href="#adapter-icon" x="${x + 12}" y="${y + 12}" width="28" height="28"/><text class="adapter-label" x="${x + 48}" y="${y + 33}">Harness adapter</text><rect class="version-tag" x="${x + w - 44}" y="${y + 13}" width="32" height="25"/>${[0,1,2,3,4,5].map(v => `<text id="${p}-v${v}" class="adapter-version" x="${x + w - 18}" y="${y + 32}" text-anchor="end" opacity="${v ? 0 : 1}">V${v}</text>`).join('')}`;
  const flow = `<g class="flow" aria-hidden="true"><path d="M652 82H698.5" fill="none" stroke-width="3" stroke-linecap="round"/><path d="M691 77L700 82L691 87" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const scenario = p => `<g class="scenario" transform="translate(92 0)"><rect id="${p}-scenario-box" class="scenario-box" x="614" y="24" width="224" height="116"/><g data-center-x="726"><use href="#flask" x="0" y="41" width="32" height="32"/><text class="entity-label scenario-label" x="42" y="65">New scenario</text></g><g id="${p}-chart" opacity="0" aria-hidden="true"><path class="score-axis" d="M646 102H814"/><text class="score-axis-label" transform="rotate(-90 640 90)" x="640" y="90" text-anchor="middle">score</text><polyline id="${p}-line" class="score-line" pathLength="5" points="654 98.6 685 95.7 716 91.4 747 87.1 778 83.2 809 79.4" style="stroke-dasharray:5;stroke-dashoffset:5"/>${[[654,98.6],[685,95.7],[716,91.4],[747,87.1],[778,83.2],[809,79.4]].map(([x,y]) => `<circle class="score-dot" cx="${x}" cy="${y}" r="3.2" opacity="0"/>`).join('')}</g><text id="${p}-limited" class="fit-label limited" x="726" y="128" text-anchor="middle" opacity="1">Poor fit</text><text id="${p}-better" class="fit-label better" x="726" y="128" text-anchor="middle" opacity="0">Better fit</text></g>`;
  const feedback = p => { const x = BX + BW / 2; return `<g id="${p}-feedback" class="feedback" opacity="0"><path class="feedback-line" d="M818 140V172H${x}V${BY + BH + 10}"/><path class="feedback-head" d="m${x - 6} ${BY + BH + 18} 6-9 6 9"/><text class="feedback-label" x="${(x + 818) / 2}" y="190" text-anchor="middle">Train from feedback</text></g>`; };
  const subtitles = `<figcaption class="subtitles"><p class="subtitle-line s1">An agent meets a new scenario. Poor fit.</p><p class="subtitle-line s2">Freeze the agent. Plug in a harness adapter.</p><p class="subtitle-line s3">Train the adapter from feedback to get better fit.</p></figcaption>`;
  const scene = (p, label) => `<svg class="scene" viewBox="0 0 980 204" role="img">
    <g id="${p}-whole" opacity="0"><rect class="whole" x="${FX}" y="${FY}" width="${FW}" height="${FH}" rx="10"/>${label ? `<text class="whole-label" x="${FX + FW - 12}" y="${FY + 17}" text-anchor="end">AGENT + ADAPTER</text>` : ''}</g>
    <g class="base-core"><rect class="core-box" x="${AX}" y="${AY}" width="${AW}" height="${AH}"/>${frozen(p)}<g id="${p}-sockets" opacity="0"><rect id="${p}-port" class="port" x="${R - 9}" y="${CY - 13}" width="18" height="26" rx="4"/></g>${heading(p, AX + AW / 2, 92)}</g>
    ${flow}${scenario(p)}${feedback(p)}
    <g id="${p}-adapter" class="adapter" opacity="0"><rect class="adapter-box" x="${BX}" y="${BY}" width="${BW}" height="${BH}"/><path class="seam" d="M${BX} ${CY}H${R + 12}"/><rect x="${R - 6}" y="${CY - 9}" width="12" height="18" rx="2.5" fill="var(--adapter)"/>${adapterInner(p, BX, BY, BW)}</g>
  </svg>`;
  const scenes = [['label', true]].map(([id, label]) => {
    const p = id, figure = document.querySelector(`#v-${id} figure`);
    figure.innerHTML = scene(p, label) + subtitles;
    const q = s => figure.querySelector(`#${p}-${s}`);
    const chart = q('chart');
    return { p, figure, whole: q('whole'), adapter: q('adapter'), frozen: q('frozen'), sockets: q('sockets'), port: q('port'), feedback: q('feedback'),
             limited: q('limited'), better: q('better'), box: q('scenario-box'), chart, line: q('line'), dots: [...chart.querySelectorAll('.score-dot')],
             versions: [0,1,2,3,4,5].map(v => q(`v${v}`)), subs: [...figure.querySelectorAll('.subtitle-line')] };
  });

  const T = { frozenAt: 1.6, adapterAt: 2.2, feedbackAt: 2.9, trainAt: 3.1, trainFor: 3 };
  const subtitleTimes = [.1, 1.6, 2.9];
  const timeline = document.getElementById('timeline'), playButton = document.getElementById('play-pause');
  let time = 0, playing = false, previous = null, frame = null;
  function render(t) {
    time = Math.min(duration, Math.max(0, t));
    const trainEnd = T.trainAt + T.trainFor, progress = clamp((time - T.trainAt) / T.trainFor), fit = fade(time, trainEnd - .25, .25);
    const stateColor = progress < .5 ? `color-mix(in srgb, var(--fail) ${(1 - progress * 2) * 100}%, #d8a036 ${progress * 200}%)`
                                     : `color-mix(in srgb, #d8a036 ${(2 - progress * 2) * 100}%, var(--pass) ${(progress * 2 - 1) * 100}%)`;
    const last = 5, step = T.trainFor / last;
    scenes.forEach(s => {
      const f = fade(time, T.frozenAt, .4);
      alpha(s.frozen, f); alpha(s.sockets, f);
      const dock = fade(time, T.adapterAt, .6);
      alpha(s.adapter, Math.min(1, dock * 1.6));
      s.adapter.setAttribute('transform', `translate(${(56 * (1 - dock)).toFixed(2)} 0)`);
      s.port.classList.toggle('lit', dock >= 1);
      alpha(s.whole, fade(time, T.adapterAt + .6, .5));          // the frame closes once the adapter has docked
      s.versions.forEach((el, v) => { const enter = v === 0 ? 1 : fade(time, T.trainAt + v * step, .08), leave = v === last ? 0 : fade(time, T.trainAt + (v + 1) * step, .08); alpha(el, enter * (1 - leave)); });
      alpha(s.feedback, fade(time, T.feedbackAt, .25) * (1 - .35 * fade(time, trainEnd + .2, .3)));
      alpha(s.limited, 1 - fit); alpha(s.better, fit);
      s.box.style.stroke = stateColor;
      alpha(s.chart, dock);
      s.dots.forEach((dot, i) => { alpha(dot, i === 0 ? 1 : fade(time, T.trainAt + i * step, .08)); dot.style.fill = stateColor; });
      s.line.style.strokeDashoffset = (last - progress * last).toFixed(3); s.line.style.stroke = stateColor;
      s.subs.forEach((el, i) => { el.style.opacity = fade(time, subtitleTimes[i], .9).toFixed(3); });
    });
    timeline.value = time.toFixed(2);
    timeline.style.setProperty('--progress', `${time / duration * 100}%`);
    document.getElementById('time').textContent = `${time.toFixed(1)} / ${duration}s`;
  }
  function setPlaying(v) { playing = v; document.getElementById('pause-icon').toggleAttribute('hidden', !v); document.getElementById('play-icon').toggleAttribute('hidden', v); previous = null; if (frame !== null) cancelAnimationFrame(frame); frame = v ? requestAnimationFrame(tick) : null; }
  function tick(now) { if (!playing) return; if (previous !== null) render(time + (now - previous) / 1000); previous = now; if (time >= duration) setPlaying(false); else frame = requestAnimationFrame(tick); }
  playButton.addEventListener('click', () => { if (playing) setPlaying(false); else { if (time >= duration) render(0); setPlaying(true); } });
  document.getElementById('replay').addEventListener('click', () => { render(0); setPlaying(true); });
  timeline.addEventListener('input', () => { setPlaying(false); render(Number(timeline.value)); });
  render(0);
  document.fonts.ready.then(() => {
    document.querySelectorAll('[data-center-x]').forEach(g => { const b = g.getBBox(); g.setAttribute('transform', `translate(${(Number(g.dataset.centerX) - b.x - b.width / 2).toFixed(3)} 0)`); });
    setPlaying(true);
  });
})();
</script>
</body></html>
