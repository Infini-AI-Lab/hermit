<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="A harness adapter is an adaptation layer for an existing agent harness, analogous to a model adapter.">

</head>
<body>
  <main id="adapter-draft">
    <figure aria-label="The model-adapter analogy: an existing model plus a model adapter, and an existing harness plus a harness adapter, each adapts to a new scenario.">
      <div class="analogy-row">
        <div class="component">

  <circle cx="20" cy="21" r=".5"></circle>
  <circle cx="20" cy="8" r=".5"></circle>
</svg><span>Existing model</span>
        </div>
        <span class="plus" aria-hidden="true">+</span>
        <div class="component adapter-component">
          <svg class="lora" viewBox="0 0 140 112" role="img" aria-label="LoRA-inspired low-rank adapter: two thin matrices on a bypass path.">
            <path d="M12 94H128 M12 94V13H128V94" class="adapter-line"></path>
            <path d="m122 90 6 4-6 4 M122 9l6 4-6 4" class="adapter-line"></path>
            <rect x="30" y="1" width="20" height="55" rx="2" class="matrix"></rect>
            <path d="M40 1v55M30 12h20M30 23h20M30 34h20M30 45h20" class="matrix-grid"></path>
            <rect x="70" y="3" width="44" height="20" rx="2" class="matrix"></rect>
            <path d="M70 13h44M81 3v20M92 3v20M103 3v20" class="matrix-grid"></path>
            <text x="70" y="76" class="icon-note">LoRA</text>
          </svg>
          <span>Model adapter</span>
        </div>
        <div class="connection" aria-hidden="true"><span></span><b>→</b></div>
        <div class="component">
          <svg aria-hidden="true" class="picked-icon" data-icon-selection="S12"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" />
  <path d="M6.453 15h11.094" />
  <path d="M8.5 2h7" />
</svg><span>New scenario</span>
        </div>
      </div>
      <div class="analogy-row harness-row">
        <div class="component">
          <svg viewBox="0 0 32 32" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="picked-icon" data-icon-selection="02"><path d="M6.5 13.5L9.682 10.318" stroke-linecap="butt"></path>
<polygon points="12.722,7.278 11.096,11.874 8.126,8.904" class="flow-arrow" fill="currentColor" stroke="none"></polygon>
<path d="M6.5 18.5L9.682 21.682" stroke-linecap="butt"></path>

<path d="M18.5 6.5L21.682 9.682" stroke-linecap="butt"></path>
<polygon points="24.722,12.722 20.126,11.096 23.096,8.126" class="flow-arrow" fill="currentColor" stroke="none"></polygon>
<path d="M18.5 25.5L21.682 22.318" stroke-linecap="butt"></path>
<polygon points="24.722,19.278 23.096,23.874 20.126,20.904" class="flow-arrow" fill="currentColor" stroke="none"></polygon>
<rect x="1.5" y="13.5" width="5" height="5" rx="1.6"></rect>
<rect x="13.5" y="1.5" width="5" height="5" rx="1.6"></rect>

        </div>
        <span class="plus" aria-hidden="true">+</span>
        <div class="component adapter-component">
          <svg viewBox="0 0 140 112" aria-hidden="true">
            <path d="M35 35H20M35 56H20M35 77H20M105 35h15M105 56h15M105 77h15" class="adapter-line"></path>

            <path d="M54 38h32M54 56h32M54 74h32" class="adapter-line"></path>
          </svg>
          <span>Harness adapter</span>
        </div>
        <div class="connection" aria-hidden="true"><span></span><b>→</b></div>
        <div class="component">
          <svg aria-hidden="true" class="picked-icon" data-icon-selection="S12"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2" />
  <path d="M6.453 15h11.094" />
  <path d="M8.5 2h7" />
</svg><span>New scenario</span>
        </div>
      </div>
      <figcaption>Same abstraction, at the harness level.</figcaption>
    </figure>
  </main>
</body>
</html>
