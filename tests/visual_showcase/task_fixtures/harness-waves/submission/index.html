<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Water — animated ocean</title>
<style>
  :root{
    --panel: rgba(8, 18, 28, 0.55);
    --panel-border: rgba(255, 255, 255, 0.18);
    --text: #eef6f8;
    --text-dim: rgba(238, 246, 248, 0.72);
    --accent: #ffd9a0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a1420;
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  #stage{
    position: fixed; inset: 0;
  }
  #stage canvas{ display: block; width: 100%; height: 100%; }

  .title{
    position: fixed; top: 14px; left: 16px; z-index: 5;
    pointer-events: none;
    text-shadow: 0 1px 10px rgba(0,10,20,0.55);
  }
  .title h1{
    margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text);
  }
  .title p{
    margin: 3px 0 0; font-size: 11.5px; letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .panel{
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 6;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    box-shadow: 0 8px 30px rgba(0, 8, 18, 0.45);
    max-width: calc(100vw - 20px);
  }
  .panel button{
    appearance: none; border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.08);
    color: var(--text);
    font: inherit; font-size: 13px; letter-spacing: 0.04em;
    padding: 8px 15px; border-radius: 999px; cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .panel button:hover{ background: rgba(255,255,255,0.18); }
  .panel button:active{ transform: scale(0.96); }
  .panel button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .slider-group{
    display: flex; align-items: center; gap: 10px;
    min-width: 0;
  }
  .slider-group label{
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); white-space: nowrap;
  }
  .slider-group output{
    font-size: 12px; font-variant-numeric: tabular-nums;
    color: var(--accent); min-width: 74px; white-space: nowrap;
  }
  input[type="range"]{
    -webkit-appearance: none; appearance: none;
    width: clamp(110px, 24vw, 200px); height: 22px;
    background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #7fd4d0, #ffd9a0);
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none; appearance: none;
    width: 17px; height: 17px; margin-top: -6px;
    border-radius: 50%; background: #fdfdfd;
    border: 1px solid rgba(0,20,30,0.4);
    box-shadow: 0 1px 6px rgba(0,10,20,0.5);
  }
  input[type="range"]::-moz-range-track{
    height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #7fd4d0, #ffd9a0);
  }
  input[type="range"]::-moz-range-thumb{
    width: 16px; height: 16px; border-radius: 50%;
    background: #fdfdfd; border: 1px solid rgba(0,20,30,0.4);
  }
  input[type="range"]:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 560px){
    .panel{
      gap: 10px; padding: 9px 13px; border-radius: 22px;
      flex-wrap: wrap; justify-content: center;
      width: max-content;
    }
    .title h1{ font-size: 14px; }
    .title p{ font-size: 10.5px; }
    .slider-group output{ min-width: 0; }
  }
</style>
</head>
<body>
<div id="stage" data-testid="scene" aria-label="Animated ocean scene with rolling swells and sunlight glitter"></div>

<header class="title">
  <h1>Open Water</h1>
  <p>Gerstner swell &middot; live wind control</p>
</header>

<div class="panel" role="group" aria-label="Scene controls">
  <button type="button" data-testid="pause" id="pauseBtn" aria-pressed="false">Pause</button>
  <button type="button" data-testid="reset" id="resetBtn">Reset</button>
  <div class="slider-group">
    <label for="intensity">Wind</label>
    <input type="range" data-testid="intensity" id="intensity" min="0" max="1" step="0.01" value="0.4"
           aria-label="Wind and sea intensity">
    <output id="intensityOut" for="intensity">0.40 &middot; moderate</output>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------ */
/*  Basic setup                                                        */
/* ------------------------------------------------------------------ */
const stage = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
const CAM_POS    = new THREE.Vector3(0, 7.4, 34);
const CAM_TARGET = new THREE.Vector3(0, 1.6, -26);
camera.position.copy(CAM_POS);
camera.lookAt(CAM_TARGET);

/* ------------------------------------------------------------------ */
/*  Shared shader pieces                                               */
/* ------------------------------------------------------------------ */
const NOISE_GLSL = /* glsl */`
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
  }
  float fbm(vec2 p){
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++){
      v += a * vnoise(p);
      p = p * 2.03 + vec2(17.3, 9.1);
      a *= 0.5;
    }
    return v;
  }
`;

/* ------------------------------------------------------------------ */
/*  Sky dome                                                           */
/* ------------------------------------------------------------------ */
const skyUniforms = {
  uTime:   { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.16, 0.16, -1).normalize() },
  uZenith: { value: new THREE.Color(0.035, 0.14, 0.30) },
  uHorizon:{ value: new THREE.Color(0.72, 0.55, 0.40) },
  uSunTint:{ value: new THREE.Color(1.0, 0.70, 0.40) }
};

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: skyUniforms,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = normalize(position);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_Position.z = gl_Position.w; // pin to far plane
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vDir;
    uniform float uTime;
    uniform vec3 uSunDir, uZenith, uHorizon, uSunTint;
    ${NOISE_GLSL}

    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, 0.0, 1.0);

      // vertical gradient
      vec3 col = mix(uHorizon, uZenith, pow(h, 0.48));

      // warm bias around the sun near the horizon
      float sunAmt = max(dot(d, uSunDir), 0.0);
      col = mix(col, uSunTint * 0.85, pow(sunAmt, 5.0) * (1.0 - h) * 0.55);

      // soft drifting cloud bands (only above the horizon)
      if (d.y > 0.015){
        vec2 uv = d.xz / (d.y + 0.14);
        vec2 drift = vec2(uTime * 0.006, uTime * 0.0023);
        float c = fbm(uv * 1.15 + drift);
        float c2 = fbm(uv * 2.6 - drift * 1.7 + 4.7);
        float cloud = smoothstep(0.52, 0.86, c * 0.72 + c2 * 0.38);
        cloud *= smoothstep(0.015, 0.14, d.y);            // fade at horizon
        cloud *= 0.55 * smoothstep(0.9, 0.25, d.y) + 0.18; // denser low, wisps high
        vec3 cloudCol = mix(vec3(1.0, 0.88, 0.78), vec3(0.62, 0.66, 0.74), smoothstep(0.1, 0.6, d.y));
        cloudCol = mix(cloudCol, uSunTint * 1.15, pow(sunAmt, 3.0) * 0.6);
        col = mix(col, cloudCol, cloud * 0.75);
      }

      // sun disc + glow
      float glow = pow(sunAmt, 20.0) * 0.28 + pow(sunAmt, 120.0) * 0.65;
      col += uSunTint * glow;
      float disc = smoothstep(0.99930, 0.99975, sunAmt);
      col += vec3(1.0, 0.84, 0.60) * disc * 1.9;

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 40, 24), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* ------------------------------------------------------------------ */
/*  Ocean surface                                                      */
/* ------------------------------------------------------------------ */
const oceanUniforms = {
  uTime:      { value: 0 },
  uIntensity: { value: 0.4 },
  uSunDir:    { value: skyUniforms.uSunDir.value },
  uSunTint:   { value: new THREE.Color(1.0, 0.78, 0.5) },
  uDeep:      { value: new THREE.Color(0.010, 0.070, 0.105) },
  uScatter:   { value: new THREE.Color(0.045, 0.30, 0.33) },
  uHorizon:   { value: skyUniforms.uHorizon.value },
  uZenith:    { value: skyUniforms.uZenith.value },
  uCamPos:    { value: camera.position }
};

const oceanVert = /* glsl */`
  precision highp float;
  uniform float uTime, uIntensity;
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying float vFoam;
  varying float vHeight;

  void addWave(vec2 dirIn, float wl, float amp, vec3 pos, float t,
               float ampScale, float Q, float dampFar,
               inout vec3 disp, inout float slopeX, inout float slopeZ,
               inout float pinch, inout float ampSum){
    vec2 dir = normalize(dirIn);
    float k = 6.2831853 / wl;
    float c = sqrt(9.81 / k) * 0.72;
    float A = amp * ampScale * dampFar;
    float phase = k * dot(dir, pos.xz) - c * k * t;
    float s = sin(phase);
    float co = cos(phase);
    disp.x += Q * A * dir.x * co;
    disp.z += Q * A * dir.y * co;
    disp.y += A * s;
    slopeX += dir.x * k * A * co;
    slopeZ += dir.y * k * A * co;
    pinch  += Q * k * A * s;
    ampSum += A;
  }

  void main(){
    float t = uTime;
    float I = uIntensity;

    float ampScale = 0.22 + 1.85 * pow(I, 1.25);
    float Q   = (0.35 + 1.05 * I) * 0.62;
    float dampFar = 1.0 - smoothstep(120.0, 340.0, length(position.xy));

    vec3 p = vec3(position.x, 0.0, position.y);
    vec3 disp = vec3(0.0);
    float slopeX = 0.0, slopeZ = 0.0;
    float pinch = 0.0;
    float ampSum = 0.0;

    addWave(vec2( 1.00, 0.15), 62.0, 1.000, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2( 0.72,-0.70), 35.0, 0.550, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2(-0.42, 0.91), 21.0, 0.300, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2( 0.90, 0.42), 12.5, 0.160, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2(-0.80,-0.52),  7.5, 0.085, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2( 0.30,-0.95),  4.6, 0.045, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2(-0.95, 0.22),  3.0, 0.026, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);
    addWave(vec2( 0.62, 0.78),  2.0, 0.015, p, t, ampScale, Q, dampFar, disp, slopeX, slopeZ, pinch, ampSum);

    vec3 world = p + disp;
    vWorld = world;
    vHeight = disp.y / max(ampSum, 1e-3);
    vNormal = normalize(vec3(-slopeX, 1.0, -slopeZ));

    // whitecaps where the surface is steep, high and pinching
    float slopeMag = length(vec2(slopeX, slopeZ));
    float foamThresh = mix(0.80, 0.40, I);
    vFoam = clamp((slopeMag + 0.55 * max(vHeight, 0.0) + 0.6 * max(pinch, 0.0) - foamThresh) * 2.4, 0.0, 1.0);

    gl_Position = projectionMatrix * viewMatrix * vec4(world, 1.0);
  }
`;

const oceanFrag = /* glsl */`
  precision highp float;
  uniform float uTime, uIntensity;
  uniform vec3 uSunDir, uSunTint, uDeep, uScatter, uHorizon, uZenith, uCamPos;
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying float vFoam;
  varying float vHeight;
  ${NOISE_GLSL}

  void main(){
    float I = uIntensity;
    vec3 V = normalize(uCamPos - vWorld);

    /* --- detail normals from two scrolling noise layers --- */
    float det = 0.10 + 0.30 * I;
    vec2 uv1 = vWorld.xz * 0.55 + vec2(uTime * 0.28, uTime * 0.11);
    vec2 uv2 = vWorld.xz * 1.70 - vec2(uTime * 0.36, -uTime * 0.22);
    float e = 0.35;
    vec3 n1 = vec3(
      vnoise(uv1 + vec2(e,0.0)) - vnoise(uv1 - vec2(e,0.0)),
      1.0,
      vnoise(uv1 + vec2(0.0,e)) - vnoise(uv1 - vec2(0.0,e))
    );
    vec3 n2 = vec3(
      vnoise(uv2 + vec2(e,0.0)) - vnoise(uv2 - vec2(e,0.0)),
      1.0,
      vnoise(uv2 + vec2(0.0,e)) - vnoise(uv2 - vec2(0.0,e))
    );
    vec3 N = normalize(vNormal + det * (n1 * 1.4 + n2 * 0.8));

    /* --- foam mask: crest pinching, broken up by noise --- */
    float fNoise = fbm(vWorld.xz * 0.9 + vec2(uTime * 0.10, -uTime * 0.06));
    float foam = vFoam;
    foam = clamp(foam * 1.35 - 0.18, 0.0, 1.0);
    foam *= smoothstep(0.30, 0.72, fNoise + foam * 0.35);
    foam = clamp(foam, 0.0, 1.0) * (0.35 + 0.65 * I);

    /* --- base water colour: deep -> scatter on crests --- */
    float crest = clamp(vHeight * 0.5 + 0.5, 0.0, 1.0);
    vec3 col = mix(uDeep, uScatter, crest * crest * 0.55);

    /* --- sky reflection via fresnel --- */
    vec3 R = reflect(-V, N);
    float skyMix = pow(clamp(R.y, 0.0, 1.0), 0.62);
    vec3 skyRef = mix(uHorizon, uZenith, skyMix);
    float fres = 0.028 + 0.972 * pow(1.0 - max(dot(N, V), 0.0), 4.6);
    col = mix(col, skyRef, clamp(fres * 1.25, 0.0, 1.0));

    /* --- sun: tight glitter + broad sheen --- */
    vec3 H = normalize(uSunDir + V);
    float spec = pow(max(dot(N, H), 0.0), 620.0) * 3.4
               + pow(max(dot(N, H), 0.0), 60.0) * 0.55;
    col += uSunTint * spec * (1.0 - foam * 0.85);

    /* --- foam brightening --- */
    vec3 foamCol = mix(vec3(0.90, 0.95, 0.97), uSunTint * 0.55 + vec3(0.6), 0.25);
    col = mix(col, foamCol, foam * 0.9);

    /* --- distance haze into the sky --- */
    float dist = length(uCamPos - vWorld);
    float fog = smoothstep(55.0, 300.0, dist);
    col = mix(col, uHorizon, fog);

    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }
`;

const oceanGeo = new THREE.PlaneGeometry(560, 560, 300, 300);
const oceanMat = new THREE.ShaderMaterial({
  uniforms: oceanUniforms,
  vertexShader: oceanVert,
  fragmentShader: oceanFrag
});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.frustumCulled = false;
scene.add(ocean);

/* ------------------------------------------------------------------ */
/*  State, controls, API                                               */
/* ------------------------------------------------------------------ */
const state = {
  ready: false,
  paused: false,
  simTime: 0,
  intensity: 0.4,
  appliedIntensity: 0.4,
  resetCount: 0
};

const pauseBtn = document.getElementById('pauseBtn');
const resetBtn = document.getElementById('resetBtn');
const intensityInput = document.getElementById('intensity');
const intensityOut = document.getElementById('intensityOut');

function describeIntensity(v){
  if (v < 0.18) return 'glassy calm';
  if (v < 0.38) return 'light breeze';
  if (v < 0.62) return 'moderate';
  if (v < 0.85) return 'fresh gusts';
  return 'storm swell';
}
function updateIntensityLabel(){
  const v = state.intensity;
  intensityOut.innerHTML = v.toFixed(2) + ' &middot; ' + describeIntensity(v);
}

pauseBtn.addEventListener('click', () => {
  state.paused = !state.paused;
  pauseBtn.setAttribute('aria-pressed', state.paused ? 'true' : 'false');
  pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
});

resetBtn.addEventListener('click', () => {
  state.simTime = 0;
  state.intensity = 0.4;
  state.appliedIntensity = 0.4;
  state.paused = false;
  state.resetCount++;
  pauseBtn.setAttribute('aria-pressed', 'false');
  pauseBtn.textContent = 'Pause';
  intensityInput.value = '0.4';
  updateIntensityLabel();
  camera.position.copy(CAM_POS);
  camera.lookAt(CAM_TARGET);
  oceanUniforms.uIntensity.value = 0.4;
  skyUniforms.uTime.value = 0;
  oceanUniforms.uTime.value = 0;
});

intensityInput.addEventListener('input', () => {
  state.intensity = parseFloat(intensityInput.value);
  updateIntensityLabel();
});
updateIntensityLabel();

window.__SHOWCASE__ = {
  getState(){
    return {
      ready: state.ready,
      paused: state.paused,
      simTime: state.simTime,
      intensity: state.intensity,
      resetCount: state.resetCount
    };
  }
};

/* ------------------------------------------------------------------ */
/*  Resize                                                             */
/* ------------------------------------------------------------------ */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  const aspect = w / h;
  camera.aspect = aspect;
  camera.fov = aspect < 0.9 ? 70 : 55;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ */
/*  Animation loop                                                     */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let needsRender = true;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);

  if (!state.paused){
    state.simTime += dt;

    // wind strength eases toward the slider value
    state.appliedIntensity += (state.intensity - state.appliedIntensity) * Math.min(1, dt * 2.6);
    if (Math.abs(state.appliedIntensity - state.intensity) < 0.0015){
      state.appliedIntensity = state.intensity;
    }

    oceanUniforms.uTime.value = state.simTime;
    oceanUniforms.uIntensity.value = state.appliedIntensity;
    skyUniforms.uTime.value = state.simTime;

    // gentle, coherent camera sway riding the swell
    const t = state.simTime;
    camera.position.x = CAM_POS.x + Math.sin(t * 0.42) * 0.9;
    camera.position.y = CAM_POS.y + Math.sin(t * 0.55 + 1.3) * 0.42;
    camera.lookAt(CAM_TARGET);
    needsRender = true;
  }

  if (needsRender){
    renderer.render(scene, camera);
    needsRender = false;
    if (!state.ready) state.ready = true;
  }
}
frame();
</script>
</body>
</html>
